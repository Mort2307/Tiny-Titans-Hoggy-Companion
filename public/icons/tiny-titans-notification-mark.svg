<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-labelledby="title description">
  <title id="title">TinyTitans western hognose head notification mark</title>
  <desc id="description">Just a western hognose head in side profile, with an upturned shovel snout, eye, nostril, and short mouth line. No body, neck or coil. White silhouette on transparency for Android notifications.</desc>
  <!-- Single-colour 24dp Android status-bar silhouette. The face is negative space. -->
  <mask id="cutouts">
    <rect width="96" height="96" fill="#fff"/>
    <ellipse cx="58" cy="40" rx="5" ry="6" fill="#000"/>
    <circle cx="87" cy="45" r="2.2" fill="#000"/>
    <path d="M47 59 Q65 66 84 54" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
  </mask>
  <path fill="#fff" mask="url(#cutouts)" d="M13 64 L14 39 C27 27 44 22 57 24 C69 25 78 31 83 37 C87 34 90 27 89 19 C94 25 96 35 92 44 C94 50 90 58 83 63 C73 71 59 75 44 73 C31 71 20 68 13 64 Z"/>
</svg>
