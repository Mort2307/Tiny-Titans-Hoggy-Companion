name: Tiny Titans Full Lint Audit

# Final source-quality audit for master and the zero-warning hardening branch.
on:
  push:
    branches:
      - master
      - chore/lint-zero-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full ESLint audit
        run: npm run lint 2>&1 | tee lint-report.txt
        shell: bash
      - name: Enforce zero warnings
        shell: bash
        run: |
          warnings=$(grep -cE 'warning[[:space:]]' lint-report.txt || true)
          echo "ESLint warnings: ${warnings}"
          test "${warnings}" -eq 0
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiny-titans-lint-report
          path: lint-report.txt
