name: KMB Finalize Persistence

on:
  push:
    branches:
      - feature/kmb-clean-integration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/kmb-clean-integration
          fetch-depth: 0

      - name: Apply final KMB persistence patch
        run: python scripts/finalizeKmbBuild.py

      - name: Commit final integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/services/mentorshipWorkspace.ts src/services/mentorshipService.ts src/pages/MentorshipRequest.tsx src/pages/BecomeAMentor.tsx src/pages/MentorDashboard.tsx src/pages/MentorshipWorkspace.tsx firestore.rules
          if git diff --cached --quiet; then
            echo "No finalization changes required."
            exit 0
          fi
          git commit -m "feat(kmb): finalize persisted mentorship lifecycle and security rules"
          git push origin HEAD:feature/kmb-clean-integration
