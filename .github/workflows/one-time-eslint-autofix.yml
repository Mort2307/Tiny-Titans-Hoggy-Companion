name: One-time ESLint autofix

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply ESLint autofixes
        run: npx eslint . --fix
      - name: Remove temporary workflow
        run: rm -f .github/workflows/one-time-eslint-autofix.yml
      - name: Commit autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autofixable changes found."
            exit 0
          fi
          git commit -m "chore: apply ESLint autofixes"
          git push
