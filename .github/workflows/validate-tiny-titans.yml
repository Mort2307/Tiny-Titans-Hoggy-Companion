name: Validate Tiny Titans

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Production gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-diagnostics
          npm run test:production-gate 2>&1 | tee ci-diagnostics/production-gate.log
      - name: Upload production gate diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tiny-titans-production-gate-${{ github.run_id }}
          path: ci-diagnostics/production-gate.log
          if-no-files-found: ignore
