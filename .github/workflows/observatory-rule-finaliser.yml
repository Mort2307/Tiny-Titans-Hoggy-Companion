name: Observatory rule finaliser

on:
  push:
    branches: [feature/husbandry-observatory]
    paths:
      - '.github/workflows/observatory-rule-finaliser.yml'

permissions:
  contents: write

jobs:
  finalise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore canonical rules and add observatory access controls
        run: |
          git fetch origin master
          git checkout origin/master -- firestore.rules storage.rules
          python3 - <<'PY'
          from pathlib import Path

          firestore = Path('firestore.rules')
          source = firestore.read_text()
          marker = '    match /{document=**} { allow read, write: if false; }'
          rule = '''    match /keeperObservations/{observationId} {\n      allow create: if signedIn() && request.resource.data.userId == request.auth.uid && request.resource.data.status == "pending" && request.resource.data.educationalConsent == true;\n      allow get, list: if signedIn() && ((resource.data.status == "approved" && resource.data.educationalConsent == true) || resource.data.userId == request.auth.uid || isCreator());\n      allow update: if isCreator() || (signedIn() && resource.data.userId == request.auth.uid && resource.data.status == "pending" && request.resource.data.status == "pending" && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['media', 'updatedAt']));\n      allow delete: if isCreator() || (signedIn() && resource.data.userId == request.auth.uid && resource.data.status == "pending");\n    }\n'''
          if 'match /keeperObservations/{observationId}' in source:
              raise SystemExit('keeperObservations rule unexpectedly already present')
          firestore.write_text(source.replace(marker, rule + marker), encoding='utf-8')

          storage = Path('storage.rules')
          source = storage.read_text()
          marker = '    match /morphLibrary/{morphId}/community/{fileName}'
          rule = '''    match /keeper-observations/{userId}/{observationId}/{fileName} {\n      allow write: if signedIn() && request.auth.uid == userId && request.resource.size <= 100 * 1024 * 1024 && request.resource.contentType.matches('^(video/(mp4|webm|quicktime)|image/(jpeg|png|webp))$');\n      // Catalogue media is intentionally available to authenticated Tiny Titans users; Firestore approval remains the publication gate.\n      allow read: if signedIn();\n    }\n'''
          if 'match /keeper-observations/{userId}' in source:
              raise SystemExit('keeper observation storage rule unexpectedly already present')
          storage.write_text(source.replace(marker, rule + marker), encoding='utf-8')
          PY

      - name: Validate observatory contracts
        run: |
          npm ci --no-audit --no-fund
          npm run validate:observatory

      - name: Commit canonical rule patch and remove finaliser
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/observatory-rule-finaliser.yml
          git add firestore.rules storage.rules
          git commit -m 'fix: finalise observatory security rules'
          git push origin HEAD:feature/husbandry-observatory
