name: Tiny Titans support fix
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/tt-support-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {ref: master, fetch-depth: 0}
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def must_replace(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if old not in t: raise SystemExit(f'Missing anchor in {path}: {old[:120]!r}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')

          # Weight dates: native date input accepts every valid historical date and only prevents future dates.
          p=Path('src/pages/WeightRecords.tsx'); t=p.read_text(encoding='utf-8')
          t=t.replace('function maskDate(value: string) { const digits = value.replace(/\\D/g, "").slice(0, 8); if (digits.length <= 2) return digits; if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`; return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`; }\n','')
          t=re.sub(r'function parseDate\(value: string\): string \| null \{.*?\n', 'function parseDate(value: string): string | null { const trimmed = value.trim(); const iso = trimmed.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (iso) { const year = Number(iso[1]); const month = Number(iso[2]); const day = Number(iso[3]); const date = new Date(year, month - 1, day); return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? trimmed : null; } const match = trimmed.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); if (!match) return null; const day = Number(match[1]); const month = Number(match[2]); const year = Number(match[3]); const date = new Date(year, month - 1, day); return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}` : null; }\n', t, count=1, flags=re.S)
          t=t.replace('const [snake, setSnake] = useState<Snake | null>(null); const [history, setHistory] = useState<WeightRecord[]>([]); const [loadedRecordKey, setLoadedRecordKey] = useState<string | null>(null); const [error, setError] = useState<string | null>(null); const [weightInput, setWeightInput] = useState(""); const today = new Date().toISOString().split("T")[0]; const [typedDate, setTypedDate] = useState(displayDate(today));','const [snake, setSnake] = useState<Snake | null>(null); const [history, setHistory] = useState<WeightRecord[]>([]); const [loadedRecordKey, setLoadedRecordKey] = useState<string | null>(null); const [error, setError] = useState<string | null>(null); const [weightInput, setWeightInput] = useState(""); const today = new Date().toISOString().split("T")[0]; const [typedDate, setTypedDate] = useState(today);')
          t=t.replace('setTypedDate(displayDate(record.date)); setDateError("");','setTypedDate(record.date); setDateError("");')
          t=t.replace('setTypedDate(displayDate(today)); setDateError("");','setTypedDate(today); setDateError("");')
          old='<label htmlFor="weight-date-text">Date<input id="weight-date-text" type="text" inputMode="text" autoComplete="off" placeholder="DD/MM/YYYY" value={typedDate} onChange={(event) => { setTypedDate(maskDate(event.target.value)); setDateError(""); }} onBlur={() => { const parsed = parseDate(typedDate); if (!parsed) setDateError("Please enter a valid date, e.g. 10/08/2026."); else setTypedDate(displayDate(parsed)); }} /><small>Use DD/MM/YYYY. Duplicate dates are prevented automatically.</small></label>'
          new='<label htmlFor="weight-date-text">Date<input id="weight-date-text" type="date" value={typedDate} max={today} onChange={(event) => { setTypedDate(event.target.value); setDateError(""); }} onBlur={() => { if (!parseDate(typedDate)) setDateError("Please choose a valid weighing date."); }} /><small>Past dates are allowed so you can rebuild an existing weight history. Future dates are not accepted.</small></label>'
          if old not in t: raise SystemExit('Missing weight date input anchor')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          # Creator queue: show the user's display name everywhere useful; keep UID only as a small audit identifier in the detail view.
          p=Path('src/pages/CreatorIssueQueues.tsx'); t=p.read_text(encoding='utf-8')
          t=t.replace('import { archiveCreatorReport, getCreatorFeedback, getCreatorReports, getIssueAttachmentUrl, updateCreatorFeedback, updateCreatorReport } from "../services/creatorService";','import { archiveCreatorReport, getCreatorFeedback, getCreatorReports, getIssueAttachmentUrl, updateCreatorFeedback, updateCreatorReport } from "../services/creatorService";\nimport { getCreatorUserDisplayNames } from "../services/creatorUserDirectoryService";')
          t=t.replace('const [error,setError]=useState(""); const [message,setMessage]=useState(""); const [creatorNotes,setCreatorNotes]=useState(""); const [resolution,setResolution]=useState(""); const [fixedVersion,setFixedVersion]=useState(""); const [attachmentUrl,setAttachmentUrl]=useState(""); const [showConversations,setShowConversations]=useState(false);','const [error,setError]=useState(""); const [message,setMessage]=useState(""); const [creatorNotes,setCreatorNotes]=useState(""); const [resolution,setResolution]=useState(""); const [fixedVersion,setFixedVersion]=useState(""); const [attachmentUrl,setAttachmentUrl]=useState(""); const [showConversations,setShowConversations]=useState(false); const [reporterNames,setReporterNames]=useState<Record<string,string>>({});')
          t=re.sub(r'async function load\(\)\{.*?\n useEffect\(\(\)=>', 'async function load(){setLoading(true);setError("");try{const [loadedBugs,loadedFeedback]=await Promise.all([getCreatorReports(),getCreatorFeedback()]);setBugs(loadedBugs);setFeedback(loadedFeedback);setReporterNames(await getCreatorUserDisplayNames([...loadedBugs,...loadedFeedback].map(item=>item.userId)));}catch(e){setError(e instanceof Error?e.message:"Creator issue queues could not be loaded.");}finally{setLoading(false);}}\n useEffect(()=>', t, count=1, flags=re.S)
          t=t.replace('void Promise.all([getCreatorReports(),getCreatorFeedback()]).then(([loadedBugs,loadedFeedback])=>{if(!active)return;setBugs(loadedBugs);setFeedback(loadedFeedback);setError("");}).catch(e=>{if(active)setError(e instanceof Error?e.message:"Creator issue queues could not be loaded.");}).finally(()=>{if(active)setLoading(false);});', 'void Promise.all([getCreatorReports(),getCreatorFeedback()]).then(async ([loadedBugs,loadedFeedback])=>{if(!active)return;setBugs(loadedBugs);setFeedback(loadedFeedback);setReporterNames(await getCreatorUserDisplayNames([...loadedBugs,...loadedFeedback].map(item=>item.userId)));setError("");}).catch(e=>{if(active)setError(e instanceof Error?e.message:"Creator issue queues could not be loaded.");}).finally(()=>{if(active)setLoading(false);});')
          t=t.replace('item.issueToken,item.userId,item.appVersion','item.issueToken,item.userId,reporterNames[item.userId],item.appVersion').replace('item.category,item.userId,item.appVersion','item.category,item.userId,reporterNames[item.userId],item.appVersion')
          t=re.sub(r'\[bugs,bugFilter,search\]', '[bugs,bugFilter,search,reporterNames]', t, count=1)
          t=re.sub(r'\[feedback,feedbackFilter,search\]', '[feedback,feedbackFilter,search,reporterNames]', t, count=1)
          t=t.replace('<small>{displayDate(item.createdAt)} · {item.appVersion||"Version not recorded"}</small></span><span className="creator-queue-status">','<small>{displayDate(item.createdAt)} · {item.appVersion||"Version not recorded"}</small><small>👤 {reporterNames[item.userId]||"Anonymous user"}</small></span><span className="creator-queue-status">',1)
          t=t.replace('<div><strong>Reporter UID</strong><span>{selectedBug.userId||"Not recorded"}</span></div>','<div><strong>Reporter</strong><span>{reporterNames[selectedBug.userId]||"Anonymous user"}</span><small>{selectedBug.userId||"User ID not recorded"}</small></div>',1)
          p.write_text(t,encoding='utf-8')

          # Conversation deep-links from notification banners.
          p=Path('src/pages/ConversationInbox.tsx'); t=p.read_text(encoding='utf-8')
          t=t.replace('import { Link } from "react-router-dom";','import { Link, useSearchParams } from "react-router-dom";')
          t=t.replace('const { user } = useAuth();\n  const [threads, setThreads]', 'const { user } = useAuth();\n  const [searchParams] = useSearchParams();\n  const [threads, setThreads]')
          t=t.replace('useEffect(() => { if (!selected) { setMessages([]); return; }','useEffect(() => { const target = searchParams.get("thread"); if (target && threads.length > 0 && !selected) { const [targetKind, targetId] = target.split(":"); const targetThread = threads.find((thread) => thread.kind === targetKind && thread.id === targetId); if (targetThread) setSelected(targetThread); } }, [searchParams, threads, selected]);\n  useEffect(() => { if (!selected) { setMessages([]); return; }',1)
          p.write_text(t,encoding='utf-8')

          Path('src/components/SupportNotificationCenter.tsx').write_text('''import { collection, doc, limit, onSnapshot, orderBy, query, updateDoc, where } from "firebase/firestore";\nimport { useEffect, useState } from "react";\nimport { useLocation, useNavigate } from "react-router-dom";\nimport { useAuth } from "../context/useAuth";\nimport { db } from "../firebase/config";\nimport "../styles/SupportNotificationCenter.css";\n\ntype SupportNotification = { id: string; title?: string; body?: string; url?: string; createdAt?: unknown };\nfunction eventTime(value: unknown) { if (!value) return 0; if (typeof value === "object" && value !== null && "toMillis" in value && typeof value.toMillis === "function") return Number(value.toMillis()) || 0; return new Date(String(value)).getTime() || 0; }\nexport default function SupportNotificationCenter() {\n  const { user } = useAuth(); const navigate = useNavigate(); const location = useLocation(); const [items,setItems]=useState<SupportNotification[]>([]);\n  useEffect(()=>{ if(!user){setItems([]);return;} const q=query(collection(db,"users",user.uid,"notificationEvents"),where("read","==",false),orderBy("createdAt","desc"),limit(20)); return onSnapshot(q,(snap)=>setItems(snap.docs.map(d=>({id:d.id,...(d.data() as Omit<SupportNotification,"id">)})).sort((a,b)=>eventTime(b.createdAt)-eventTime(a.createdAt))),()=>setItems([])); },[user]);\n  if(!user||items.length===0)return null; const item=items[0]; const href=item.url||"/conversations";\n  async function mark(read=true){try{await updateDoc(doc(db,"users",user.uid,"notificationEvents",item.id),{read,readAt:new Date()});}catch{} if(read){setItems((current)=>current.filter((entry)=>entry.id!==item.id));}}\n  async function open(){await mark();if(href!==location.pathname+location.search)navigate(href);}\n  return <aside className="tt-support-notification" role="status" aria-live="polite"><div className="tt-support-notification-icon">💬</div><div className="tt-support-notification-copy"><strong>{item.title||"Tiny Titans message"}</strong><p>{item.body||"You have a new message."}</p></div><button type="button" onClick={()=>void open()}>View</button><button type="button" className="secondary" aria-label="Dismiss notification" onClick={()=>void mark()}>✕</button></aside>;\n}\n''',encoding='utf-8')
          Path('src/styles/SupportNotificationCenter.css').write_text('''.tt-support-notification{position:fixed;right:20px;bottom:20px;z-index:1200;display:grid;grid-template-columns:auto minmax(220px,1fr) auto auto;gap:12px;align-items:center;width:min(560px,calc(100vw - 40px));padding:14px 16px;border:1px solid rgba(213,170,75,.42);border-radius:16px;background:rgba(24,28,29,.97);box-shadow:0 18px 50px rgba(0,0,0,.42);backdrop-filter:blur(12px)}.tt-support-notification-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(213,170,75,.14);font-size:20px}.tt-support-notification-copy{min-width:0}.tt-support-notification-copy strong{display:block;color:#f4f0e4;font-size:14px}.tt-support-notification-copy p{margin:3px 0 0;color:#c6c4bb;font-size:13px;line-height:1.4}.tt-support-notification button{border:0;border-radius:10px;padding:9px 12px;background:#d5aa4b;color:#151817;font-weight:800;cursor:pointer}.tt-support-notification button.secondary{background:transparent;color:#a7a59d;padding-inline:8px}@media(max-width:640px){.tt-support-notification{right:10px;bottom:10px;width:calc(100vw - 20px);grid-template-columns:auto 1fr auto}.tt-support-notification button:not(.secondary){grid-column:2;grid-row:2;justify-self:start}.tt-support-notification button.secondary{grid-column:3;grid-row:1}}''',encoding='utf-8')

          # Wire the visual centre into the application shell.
          p=Path('src/App.tsx'); t=p.read_text(encoding='utf-8'); t=t.replace('import NotificationBridge from "./components/NotificationBridge";','import NotificationBridge from "./components/NotificationBridge";\nimport SupportNotificationCenter from "./components/SupportNotificationCenter";'); t=t.replace('      <NotificationBridge />','      <NotificationBridge />\n      <SupportNotificationCenter />'); p.write_text(t,encoding='utf-8')

          Path('functions/supportNotifications.js').write_text('''const { onDocumentCreated } = require("firebase-functions/v2/firestore");\nconst { getFirestore, FieldValue } = require("firebase-admin/firestore");\nconst { getMessaging } = require("firebase-admin/messaging");\nconst db = getFirestore();\nasync function creatorUids(){const [admins,creators]=await Promise.all([db.collection("users").where("role","==","admin").get(),db.collection("users").where("profileType","==","creator").get()]);return [...new Set([...admins.docs,...creators.docs].map((d)=>d.id))];}\nasync function name(uid){if(!uid)return "Anonymous user";const s=await db.collection("users").doc(uid).get();return String(s.data()?.displayName||"Anonymous user").trim()||"Anonymous user";}\nasync function emit(uid,payload){if(!uid)return;const ref=await db.collection("users").doc(uid).collection("notificationEvents").add({...payload,read:false,createdAt:FieldValue.serverTimestamp()});const snaps=await db.collection("users").doc(uid).collection("notificationTokens").where("enabled","==",true).get().catch(()=>null);const tokens=snaps?snaps.docs.map((d)=>String(d.data().token||"")).filter(Boolean):[];if(!tokens.length)return;try{const result=await getMessaging().sendEachForMulticast({tokens,notification:{title:payload.title,body:payload.body},data:{eventKey:ref.id,title:payload.title,body:payload.body,url:payload.url||"/"}});await Promise.all(result.responses.map((r,i)=>r.success?null:snaps.docs[i].ref.update({enabled:false}).catch(()=>undefined)));}catch(error){console.warn("Tiny Titans support push failed",error);}}\nasync function emitCreators(payload){await Promise.all((await creatorUids()).map((uid)=>emit(uid,payload)));}\nexports.notifyCreatorOnIssueReport=onDocumentCreated({region:"europe-west2",document:"issueReports/{reportId}"},async(event)=>{const data=event.data?.data()||{};const who=await name(String(data.userId||""));await emitCreators({eventType:"support-submission",kind:"bug",parentId:event.params.reportId,title:"🐛 New bug report",body:`${who} submitted: ${String(data.title||"Bug report")}`,url:`/creator/conversations?thread=bug:${event.params.reportId}`});});\nexports.notifyCreatorOnFeedback=onDocumentCreated({region:"europe-west2",document:"feedback/{feedbackId}"},async(event)=>{const data=event.data?.data()||{};const who=await name(String(data.userId||""));await emitCreators({eventType:"support-submission",kind:"feedback",parentId:event.params.feedbackId,title:"💡 New feedback",body:`${who} submitted: ${String(data.title||"Feedback")}`,url:`/creator/conversations?thread=feedback:${event.params.feedbackId}`});});\nasync function messageNotification(kind,parentId,message){const parent=await db.collection(kind==="bug"?"issueReports":"feedback").doc(parentId).get();if(!parent.exists)return;const data=parent.data()||{};const senderRole=String(message.senderRole||"");const senderId=String(message.senderId||"");const title=String(data.title||(kind==="bug"?"Bug report":"Feedback"));if(senderRole==="user"){const who=await name(senderId);await emitCreators({eventType:"support-message",kind,parentId,title:"💬 New support reply",body:`${who} replied to: ${title}`,url:`/creator/conversations?thread=${kind}:${parentId}`});}else if(senderRole==="creator"&&data.userId){await emit(String(data.userId),{eventType:"support-message",kind,parentId,title:"🐍 Tiny Titans replied",body:`You have a new message about: ${title}`,url:`/conversations?thread=${kind}:${parentId}`});}}\nexports.notifyOnIssueMessage=onDocumentCreated({region:"europe-west2",document:"issueReports/{reportId}/messages/{messageId}"},async(event)=>messageNotification("bug",event.params.reportId,event.data?.data()||{}));\nexports.notifyOnFeedbackMessage=onDocumentCreated({region:"europe-west2",document:"feedback/{feedbackId}/messages/{messageId}"},async(event)=>messageNotification("feedback",event.params.feedbackId,event.data?.data()||{}));\n''',encoding='utf-8')
          must_replace('functions/index.js','Object.assign(exports, require("./notificationTest"));','Object.assign(exports, require("./notificationTest"));\nObject.assign(exports, require("./supportNotifications"));')

      - name: Validate
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          cd functions
          npm ci --no-audit --no-fund
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Commit to master and remove fixer
        run: |
          rm .github/workflows/tt-support-fix.yml
          git config user.name "Tiny Titans Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions/index.js functions/supportNotifications.js .github/workflows/tt-support-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: historical weights and support conversations"
          git push origin master
