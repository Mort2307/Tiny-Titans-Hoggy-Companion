name: Apply Tiny Titans support fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0

      - name: Patch application and functions
        shell: python
        run: |
          from pathlib import Path
          import re

          def patch(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Missing patch anchor in {path}: {old[:160]!r}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(text, encoding='utf-8')

          # Historical weight dates: use the browser's date control internally, while
          # retaining a tolerant parser for older links/data that may still pass DD/MM/YYYY.
          patch('src/pages/WeightRecords.tsx', [
              ('function maskDate(value: string) { const digits = value.replace(/\\D/g, "").slice(0, 8); if (digits.length <= 2) return digits; if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`; return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`; }\nfunction parseDate(value: string): string | null { const match = value.trim().match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); if (!match) return null; const day = Number(match[1]); const month = Number(match[2]); const year = Number(match[3]); const date = new Date(year, month - 1, day); if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null; return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`; }',
               'function parseDate(value: string): string | null { const trimmed = value.trim(); const isoMatch = trimmed.match(/^(\\d{4})-(\\d{2})-(\\d{2})$/); if (isoMatch) { const year = Number(isoMatch[1]); const month = Number(isoMatch[2]); const day = Number(isoMatch[3]); const date = new Date(year, month - 1, day); return date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day ? trimmed : null; } const match = trimmed.match(/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/); if (!match) return null; const day = Number(match[1]); const month = Number(match[2]); const year = Number(match[3]); const date = new Date(year, month - 1, day); if (date.getFullYear() !== year || date.getMonth() !== month - 1 || date.getDate() !== day) return null; return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`; }'),
              ('const [snake, setSnake] = useState<Snake | null>(null); const [history, setHistory] = useState<WeightRecord[]>([]); const [loadedRecordKey, setLoadedRecordKey] = useState<string | null>(null); const [error, setError] = useState<string | null>(null); const [weightInput, setWeightInput] = useState(""); const today = new Date().toISOString().split("T")[0]; const [typedDate, setTypedDate] = useState(displayDate(today));',
               'const [snake, setSnake] = useState<Snake | null>(null); const [history, setHistory] = useState<WeightRecord[]>([]); const [loadedRecordKey, setLoadedRecordKey] = useState<string | null>(null); const [error, setError] = useState<string | null>(null); const [weightInput, setWeightInput] = useState(""); const today = new Date().toISOString().split("T")[0]; const [typedDate, setTypedDate] = useState(today);'),
              ('setTypedDate(displayDate(record.date)); setDateError("");', 'setTypedDate(record.date); setDateError("");'),
              ('setTypedDate(displayDate(today)); setDateError("");', 'setTypedDate(today); setDateError("");'),
              ('<label htmlFor="weight-date-text">Date<input id="weight-date-text" type="text" inputMode="text" autoComplete="off" placeholder="DD/MM/YYYY" value={typedDate} onChange={(event) => { setTypedDate(maskDate(event.target.value)); setDateError(""); }} onBlur={() => { const parsed = parseDate(typedDate); if (!parsed) setDateError("Please enter a valid date, e.g. 10/08/2026."); else setTypedDate(displayDate(parsed)); }} /><small>Use DD/MM/YYYY. Duplicate dates are prevented automatically.</small></label>',
               '<label htmlFor="weight-date-text">Date<input id="weight-date-text" type="date" value={typedDate} max={today} onChange={(event) => { setTypedDate(event.target.value); setDateError(""); }} onBlur={() => { const parsed = parseDate(typedDate); if (!parsed) setDateError("Please choose a valid weighing date."); }} /><small>Past dates are allowed so you can rebuild an existing weight history. Future dates are not accepted.</small></label>'),
              ('setTypedDate(displayDate(today)); setDateError(""); setEditingId(null);', 'setTypedDate(today); setDateError(""); setEditingId(null);'),
          ])

          # Creator queue: resolve and display real names, while retaining the UID as a secondary audit identifier.
          patch('src/pages/CreatorIssueQueues.tsx', [
              ('import { archiveCreatorReport, getCreatorFeedback, getCreatorReports, getIssueAttachmentUrl, updateCreatorFeedback, updateCreatorReport } from "../services/creatorService";',
               'import { archiveCreatorReport, getCreatorFeedback, getCreatorReports, getIssueAttachmentUrl, updateCreatorFeedback, updateCreatorReport } from "../services/creatorService";\nimport { getCreatorUserDisplayNames } from "../services/creatorUserDirectoryService";'),
              ('const [error,setError]=useState(""); const [message,setMessage]=useState(""); const [creatorNotes,setCreatorNotes]=useState(""); const [resolution,setResolution]=useState(""); const [fixedVersion,setFixedVersion]=useState(""); const [attachmentUrl,setAttachmentUrl]=useState(""); const [showConversations,setShowConversations]=useState(false);',
               'const [error,setError]=useState(""); const [message,setMessage]=useState(""); const [creatorNotes,setCreatorNotes]=useState(""); const [resolution,setResolution]=useState(""); const [fixedVersion,setFixedVersion]=useState(""); const [attachmentUrl,setAttachmentUrl]=useState(""); const [showConversations,setShowConversations]=useState(false); const [reporterNames,setReporterNames]=useState<Record<string,string>>({});'),
              ('async function load(){setLoading(true);setError("");try{const [loadedBugs,loadedFeedback]=await Promise.all([getCreatorReports(),getCreatorFeedback()]);setBugs(loadedBugs);setFeedback(loadedFeedback);}catch(e){setError(e instanceof Error?e.message:"Creator issue queues could not be loaded.");}finally{setLoading(false);}}',
               'async function load(){setLoading(true);setError("");try{const [loadedBugs,loadedFeedback]=await Promise.all([getCreatorReports(),getCreatorFeedback()]);setBugs(loadedBugs);setFeedback(loadedFeedback);const names=await getCreatorUserDisplayNames([...loadedBugs,...loadedFeedback].map(item=>item.userId));setReporterNames(names);}catch(e){setError(e instanceof Error?e.message:"Creator issue queues could not be loaded.");}finally{setLoading(false);}}'),
              ('void Promise.all([getCreatorReports(),getCreatorFeedback()]).then(([loadedBugs,loadedFeedback])=>{if(!active)return;setBugs(loadedBugs);setFeedback(loadedFeedback);setError("");})',
               'void Promise.all([getCreatorReports(),getCreatorFeedback()]).then(async ([loadedBugs,loadedFeedback])=>{if(!active)return;setBugs(loadedBugs);setFeedback(loadedFeedback);setReporterNames(await getCreatorUserDisplayNames([...loadedBugs,...loadedFeedback].map(item=>item.userId)));setError("");})'),
              ('[item.title,item.description,item.category,item.source,item.issueToken,item.userId,item.appVersion].some', '[item.title,item.description,item.category,item.source,item.issueToken,item.userId,reporterNames[item.userId],item.appVersion].some'),
              ('[item.title,item.message,item.category,item.userId,item.appVersion].some', '[item.title,item.message,item.category,item.userId,reporterNames[item.userId],item.appVersion].some'),
              '],}',
               '],reporterNames]);'),
              ('<div><strong>Reporter UID</strong><span>{selectedBug.userId||"Not recorded"}</span></div>', '<div><strong>Reporter</strong><span>{reporterNames[selectedBug.userId]||"Anonymous user"}</span><small>{selectedBug.userId||"User ID not recorded"}</small></div>'),
              ('<small>{displayDate(item.createdAt)} · {item.appVersion||"Version not recorded"}</small></span><span className="creator-queue-status">', '<small>{displayDate(item.createdAt)} · {item.appVersion||"Version not recorded"}</small><small>👤 {reporterNames[item.userId]||"Anonymous user"}</small></span><span className="creator-queue-status">'),
          ])

          # Conversation deep-link support so notification clicks open the exact thread.
          patch('src/pages/ConversationInbox.tsx', [
              ('import { Link } from "react-router-dom";', 'import { Link, useSearchParams } from "react-router-dom";'),
              ('const { user } = useAuth();\n  const [threads, setThreads]', 'const { user } = useAuth();\n  const [searchParams] = useSearchParams();\n  const [threads, setThreads]'),
              ('useEffect(() => { if (!selected) { setMessages([]); return; }', 'useEffect(() => { const target = searchParams.get("thread"); if (target && threads.length > 0 && !selected) { const [targetKind, targetId] = target.split(":"); const targetThread = threads.find((thread) => thread.kind === targetKind && thread.id === targetId); if (targetThread) setSelected(targetThread); } }, [searchParams, threads, selected]);\n  useEffect(() => { if (!selected) { setMessages([]); return; }'),
          ])

          # Global visual notification centre.
          Path('src/components/SupportNotificationCenter.tsx').write_text('''import { collection, onSnapshot, orderBy, query, updateDoc, where, limit } from "firebase/firestore";\nimport { useEffect, useState } from "react";\nimport { useLocation, useNavigate } from "react-router-dom";\nimport { useAuth } from "../context/useAuth";\nimport { db } from "../firebase/config";\nimport "../styles/SupportNotificationCenter.css";\n\ntype SupportNotification = { id: string; title?: string; body?: string; url?: string; eventKey?: string; createdAt?: { toMillis?: () => number } | unknown };\n\nfunction eventTime(value: unknown) { if (!value) return 0; if (typeof value === "object" && value !== null && "toMillis" in value && typeof value.toMillis === "function") return Number(value.toMillis()) || 0; return new Date(String(value)).getTime() || 0; }\n\nexport default function SupportNotificationCenter() {\n  const { user } = useAuth();\n  const navigate = useNavigate();\n  const location = useLocation();\n  const [items, setItems] = useState<SupportNotification[]>([]);\n  const [dismissed, setDismissed] = useState("");\n  useEffect(() => { if (!user) { setItems([]); return; } const q = query(collection(db, "users", user.uid, "notificationEvents"), where("read", "==", false), orderBy("createdAt", "desc"), limit(20)); return onSnapshot(q, (snapshot) => { setItems(snapshot.docs.map((item) => ({ id: item.id, ...(item.data() as Omit<SupportNotification, "id">) })).sort((a,b) => eventTime(b.createdAt)-eventTime(a.createdAt))); }, () => setItems([])); }, [user]);\n  if (!user || items.length === 0 || dismissed === items[0].id) return null;\n  const notification = items[0];\n  const href = notification.url || "/conversations";\n  async function open() { await updateDoc(collection(db, "users", user.uid, "notificationEvents").withConverter({} as never) as never).catch(() => undefined); }\n  async function markAndOpen() { try { await updateDoc((await import("firebase/firestore")).doc(db, "users", user.uid, "notificationEvents", notification.id), { read: true, readAt: new Date() }); } catch {} setDismissed(notification.id); if (href !== location.pathname + location.search) navigate(href); }\n  async function dismiss() { try { await updateDoc((await import("firebase/firestore")).doc(db, "users", user.uid, "notificationEvents", notification.id), { read: true, readAt: new Date() }); } catch {} setDismissed(notification.id); }\n  return <aside className="tt-support-notification" role="status" aria-live="polite"><div className="tt-support-notification-icon">💬</div><div className="tt-support-notification-copy"><strong>{notification.title || "Tiny Titans message"}</strong><p>{notification.body || "You have a new message from Tiny Titans."}</p></div><button type="button" onClick={() => void markAndOpen()}>View</button><button type="button" className="secondary" aria-label="Dismiss notification" onClick={() => void dismiss()}>✕</button></aside>;\n}\n''', encoding='utf-8')

          # Remove the intentionally unused helper before linting.
          p = Path('src/components/SupportNotificationCenter.tsx')
          t = p.read_text(encoding='utf-8')
          t = re.sub(r'\n  async function open\(\).*?\n', '\n', t, flags=re.S)
          t = t.replace('collection, onSnapshot, orderBy, query, updateDoc, where, limit', 'collection, doc, onSnapshot, orderBy, query, updateDoc, where, limit')
          t = t.replace('(await import("firebase/firestore")).doc(db, "users", user.uid, "notificationEvents", notification.id)', 'doc(db, "users", user.uid, "notificationEvents", notification.id)')
          p.write_text(t, encoding='utf-8')

          Path('src/styles/SupportNotificationCenter.css').write_text('''.tt-support-notification{position:fixed;right:20px;bottom:20px;z-index:1200;display:grid;grid-template-columns:auto minmax(220px,1fr) auto auto;gap:12px;align-items:center;width:min(560px,calc(100vw - 40px));padding:14px 16px;border:1px solid rgba(213,170,75,.42);border-radius:16px;background:rgba(24,28,29,.97);box-shadow:0 18px 50px rgba(0,0,0,.42);backdrop-filter:blur(12px)}.tt-support-notification-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:rgba(213,170,75,.14);font-size:20px}.tt-support-notification-copy{min-width:0}.tt-support-notification-copy strong{display:block;color:#f4f0e4;font-size:14px}.tt-support-notification-copy p{margin:3px 0 0;color:#c6c4bb;font-size:13px;line-height:1.4}.tt-support-notification button{border:0;border-radius:10px;padding:9px 12px;background:#d5aa4b;color:#151817;font-weight:800;cursor:pointer}.tt-support-notification button.secondary{background:transparent;color:#a7a59d;padding-inline:8px}@media(max-width:640px){.tt-support-notification{right:10px;bottom:10px;width:calc(100vw - 20px);grid-template-columns:auto 1fr auto}.tt-support-notification button.secondary{grid-column:3;grid-row:1}.tt-support-notification button:not(.secondary){grid-column:2;grid-row:2;justify-self:start}}''', encoding='utf-8')

          Path('functions/supportNotifications.js').write_text('''const { onDocumentCreated } = require("firebase-functions/v2/firestore");\nconst { getFirestore, FieldValue } = require("firebase-admin/firestore");\nconst { getMessaging } = require("firebase-admin/messaging");\n\nconst db = getFirestore();\n\nasync function creatorUids() {\n  const [admins, creators] = await Promise.all([\n    db.collection("users").where("role", "==", "admin").get(),\n    db.collection("users").where("profileType", "==", "creator").get(),\n  ]);\n  return [...new Set([...admins.docs, ...creators.docs].map((snap) => snap.id))];\n}\n\nasync function displayName(uid) {\n  if (!uid) return "Anonymous user";\n  const snap = await db.collection("users").doc(uid).get();\n  return String(snap.data()?.displayName || "Anonymous user").trim() || "Anonymous user";\n}\n\nasync function emit(uid, payload) {\n  if (!uid) return;\n  const eventRef = await db.collection("users").doc(uid).collection("notificationEvents").add({ ...payload, read: false, createdAt: FieldValue.serverTimestamp() });\n  const tokenSnap = await db.collection("users").doc(uid).collection("notificationTokens").where("enabled", "==", true).get().catch(() => null);\n  const tokens = tokenSnap ? tokenSnap.docs.map((snap) => String(snap.data().token || "")).filter(Boolean) : [];\n  if (!tokens.length) return;\n  try {\n    const response = await getMessaging().sendEachForMulticast({ tokens, notification: { title: payload.title, body: payload.body }, data: { eventKey: eventRef.id, title: payload.title, body: payload.body, url: payload.url || "/" } });\n    if (response.responses.some((item) => !item.success)) {\n      const failed = response.responses.map((item, index) => item.success ? null : tokenSnap.docs[index]).filter(Boolean);\n      await Promise.all(failed.map((snap) => snap.ref.update({ enabled: false }).catch(() => undefined)));\n    }\n  } catch (error) {\n    console.warn("Tiny Titans: support push delivery failed", error);\n  }\n}\n\nasync function emitCreators(payload) { await Promise.all((await creatorUids()).map((uid) => emit(uid, payload))); }\n\nexports.notifyCreatorOnIssueReport = onDocumentCreated({ region: "europe-west2", document: "issueReports/{reportId}" }, async (event) => {\n  const report = event.data?.data() || {};\n  const name = await displayName(String(report.userId || ""));\n  await emitCreators({ eventType: "support-submission", kind: "bug", parentId: event.params.reportId, title: "🐛 New bug report", body: `${name} submitted: ${String(report.title || "Bug report")}`, url: `/creator/conversations?thread=bug:${event.params.reportId}` });\n});\n\nexports.notifyCreatorOnFeedback = onDocumentCreated({ region: "europe-west2", document: "feedback/{feedbackId}" }, async (event) => {\n  const item = event.data?.data() || {};\n  const name = await displayName(String(item.userId || ""));\n  await emitCreators({ eventType: "support-submission", kind: "feedback", parentId: event.params.feedbackId, title: "💡 New feedback", body: `${name} submitted: ${String(item.title || "Feedback")}`, url: `/creator/conversations?thread=feedback:${event.params.feedbackId}` });\n});\n\nasync function notifyMessage(kind, parentId, message) {\n  const parent = await db.collection(kind === "bug" ? "issueReports" : "feedback").doc(parentId).get();\n  if (!parent.exists) return;\n  const data = parent.data() || {};\n  const senderRole = String(message.senderRole || "");\n  const senderId = String(message.senderId || "");\n  const title = String(data.title || (kind === "bug" ? "Bug report" : "Feedback"));\n  if (senderRole === "user") {\n    const name = await displayName(senderId);\n    await emitCreators({ eventType: "support-message", kind, parentId, title: "💬 New support reply", body: `${name} replied to: ${title}`, url: `/creator/conversations?thread=${kind}:${parentId}` });\n  } else if (senderRole === "creator" && data.userId) {\n    await emit(String(data.userId), { eventType: "support-message", kind, parentId, title: "🐍 Tiny Titans replied", body: `You have a new message about: ${title}`, url: `/conversations?thread=${kind}:${parentId}` });\n  }\n}\n\nexports.notifyOnIssueMessage = onDocumentCreated({ region: "europe-west2", document: "issueReports/{reportId}/messages/{messageId}" }, async (event) => { await notifyMessage("bug", event.params.reportId, event.data?.data() || {}); });\nexports.notifyOnFeedbackMessage = onDocumentCreated({ region: "europe-west2", document: "feedback/{feedbackId}/messages/{messageId}" }, async (event) => { await notifyMessage("feedback", event.params.feedbackId, event.data?.data() || {}); });\n''', encoding='utf-8')

          patch('functions/index.js', [
              ('Object.assign(exports, require("./notificationTest"));', 'Object.assign(exports, require("./notificationTest"));\nObject.assign(exports, require("./supportNotifications"));'),
          ])

          patch('src/App.tsx', [
              ('import NotificationBridge from "./components/NotificationBridge";', 'import NotificationBridge from "./components/NotificationBridge";\nimport SupportNotificationCenter from "./components/SupportNotificationCenter";'),
              ('      <NotificationBridge />', '      <NotificationBridge />\n      <SupportNotificationCenter />'),
          ])

          patch('src/pages/ConversationInbox.tsx', [
              ('useEffect(() => { if (!selected) { setMessages([]); return; }', 'useEffect(() => { if (!selected) { setMessages([]); return; }'),
          ])

      - name: Remove this one-shot workflow from the resulting commit
        run: |
          rm .github/workflows/tt-support-fix.yml

      - name: Validate application
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build

      - name: Validate Functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Commit fixes to master
        run: |
          git config user.name "Tiny Titans Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions/index.js functions/supportNotifications.js .github/workflows/tt-support-fix.yml
          git diff --cached --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "fix: historical weights and support notifications"
          git push origin master
