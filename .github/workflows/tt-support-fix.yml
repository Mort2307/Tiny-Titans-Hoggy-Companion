name: Tiny Titans Support Fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply support fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def write(path: str, content: str):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8')

          # 1) Historical weight dates: validate dates without imposing any today-only restriction.
          p = Path('src/pages/WeightRecords.tsx')
          text = p.read_text(encoding='utf-8')
          pattern = r'function maskDate\(value: string\).*?function makeId\(\) \{.*?\n'
          replacement = '''function parseDate(value: string): string | null {\n  const raw = value.trim();\n  let match = raw.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);\n  let day: number;\n  let month: number;\n  let year: number;\n  if (match) {\n    day = Number(match[1]);\n    month = Number(match[2]);\n    year = Number(match[3]);\n  } else {\n    match = raw.match(/^(\\d{4})[\\/.-](\\d{1,2})[\\/.-](\\d{1,2})$/);\n    if (!match) return null;\n    year = Number(match[1]);\n    month = Number(match[2]);\n    day = Number(match[3]);\n  }\n  const date = new Date(Date.UTC(year, month - 1, day));\n  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;\n  return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;\n}\nfunction makeId() { return typeof crypto !== "undefined" && typeof crypto.randomUUID === "function" ? crypto.randomUUID() : `weight-${Date.now()}-${Math.random().toString(36).slice(2)}`; }\n'''
          new_text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Could not locate WeightRecords date helper block')
          new_text = new_text.replace('setTypedDate(maskDate(event.target.value))', 'setTypedDate(event.target.value)')
          new_text = new_text.replace('Use DD/MM/YYYY. Duplicate dates are prevented automatically.', 'Enter the date the weigh-in actually happened. Historical dates are allowed. Duplicate dates are prevented automatically.')
          p.write_text(new_text, encoding='utf-8')

          # 2) Named reporter display in Creator issue modal.
          write('src/components/CreatorReporterName.tsx', '''import { useEffect, useState } from "react";\nimport { getCreatorUserDisplayNames } from "../services/creatorUserDirectoryService";\n\nexport default function CreatorReporterName({ uid }: { uid: string }) {\n  const [name, setName] = useState(uid ? "Loading…" : "Not recorded");\n  useEffect(() => {\n    if (!uid) return;\n    let active = true;\n    void getCreatorUserDisplayNames([uid]).then((names) => {\n      if (active) setName(names[uid] || "Anonymous user");\n    }).catch(() => {\n      if (active) setName("Anonymous user");\n    });\n    return () => { active = false; };\n  }, [uid]);\n  return <>{name}</>;\n}\n''')

          p = Path('src/pages/CreatorIssueQueues.tsx')
          text = p.read_text(encoding='utf-8')
          if 'CreatorReporterName' not in text:
              needle = 'import { getCreatorUserDisplayNames } from "../services/creatorUserDirectoryService";\n'
              if needle not in text:
                  raise SystemExit('Could not find CreatorIssueQueues import anchor')
              text = text.replace(needle, needle + 'import CreatorReporterName from "../components/CreatorReporterName";\n', 1)
          old = '<div><strong>Reporter UID</strong><span>{selectedBug.userId||"Not recorded"}</span></div>'
          new = '<div><strong>Reporter</strong><span><CreatorReporterName uid={selectedBug.userId || ""} /></span></div>'
          if old not in text:
              raise SystemExit('Could not find CreatorIssueQueues reporter field')
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')

          # 3) Deep-link support conversations from notification clicks.
          p = Path('src/pages/ConversationInbox.tsx')
          text = p.read_text(encoding='utf-8')
          text = text.replace('import { Link } from "react-router-dom";', 'import { Link, useSearchParams } from "react-router-dom";', 1)
          anchor = '  const [queue, setQueue] = useState<Queue>("active");\n'
          injected = anchor + '''  const [searchParams, setSearchParams] = useSearchParams();\n'''
          if anchor not in text:
              raise SystemExit('Could not find ConversationInbox state anchor')
          text = text.replace(anchor, injected, 1)
          effect_anchor = '  useEffect(() => { if (!selected) { setMessages([]); return; } let active = true;'
          deep_effect = '''  useEffect(() => {\n    const id = searchParams.get("id");\n    const kind = searchParams.get("kind") as ConversationKind | null;\n    if (!id || !kind || threads.length === 0) return;\n    const target = threads.find((thread) => thread.id === id && thread.kind === kind);\n    if (!target) return;\n    setSelected(target);\n    const next = new URLSearchParams(searchParams);\n    next.delete("id");\n    next.delete("kind");\n    setSearchParams(next, { replace: true });\n  }, [threads, searchParams, setSearchParams]);\n\n'''
          if effect_anchor not in text:
              raise SystemExit('Could not find ConversationInbox message effect anchor')
          text = text.replace(effect_anchor, deep_effect + effect_anchor, 1)
          p.write_text(text, encoding='utf-8')

          # 4) Real-time unread support notifications and visual banner.
          write('src/components/NotificationCenter.tsx', '''import { collection, doc, onSnapshot, query, updateDoc, where, serverTimestamp } from "firebase/firestore";\nimport { useEffect, useRef, useState } from "react";\nimport { useLocation, useNavigate } from "react-router-dom";\nimport { useAuth } from "../context/useAuth";\nimport { db } from "../firebase/config";\nimport "../styles/notificationCenter.css";\n\ntype NotificationEvent = {\n  id: string;\n  type?: string;\n  title?: string;\n  body?: string;\n  url?: string;\n  createdAt?: unknown;\n  read?: boolean;\n};\n\nfunction timestamp(value: unknown): number {\n  if (!value) return 0;\n  if (typeof value === "object" && value !== null && "toMillis" in value && typeof value.toMillis === "function") return Number(value.toMillis()) || 0;\n  if (typeof value === "object" && value !== null && "toDate" in value && typeof value.toDate === "function") return value.toDate().getTime() || 0;\n  const parsed = new Date(String(value)).getTime();\n  return Number.isFinite(parsed) ? parsed : 0;\n}\n\nexport default function NotificationCenter() {\n  const { user } = useAuth();\n  const location = useLocation();\n  const navigate = useNavigate();\n  const [events, setEvents] = useState<NotificationEvent[]>([]);\n  const initialised = useRef(false);\n  const seen = useRef<Set<string>>(new Set());\n  const creatorMode = location.pathname.startsWith("/creator");\n\n  useEffect(() => {\n    initialised.current = false;\n    seen.current = new Set();\n    setEvents([]);\n    if (!user) return;\n    const eventsRef = collection(db, "users", user.uid, "notificationEvents");\n    const eventsQuery = query(eventsRef, where("read", "==", false));\n    return onSnapshot(eventsQuery, (snapshot) => {\n      const next = snapshot.docs.map((item) => ({ id: item.id, ...(item.data() as Omit<NotificationEvent, "id">) })).sort((a, b) => timestamp(b.createdAt) - timestamp(a.createdAt));\n      if (initialised.current) {\n        snapshot.docChanges().forEach((change) => {\n          if (change.type !== "added" || seen.current.has(change.doc.id)) return;\n          const event = { id: change.doc.id, ...(change.doc.data() as Omit<NotificationEvent, "id">) };\n          if (typeof window !== "undefined" && "Notification" in window && Notification.permission === "granted" && document.visibilityState === "visible") {\n            const popup = new Notification(event.title || "Tiny Titans", { body: event.body || "You have a new Tiny Titans message.", icon: "/favicon.svg", badge: "/favicon.svg", tag: event.id });\n            popup.onclick = () => { window.focus(); if (event.url) window.location.assign(event.url); };\n          }\n        });\n      }\n      seen.current = new Set(snapshot.docs.map((item) => item.id));\n      setEvents(next);\n      initialised.current = true;\n    }, (error) => {\n      console.warn("Tiny Titans: notification stream unavailable", error);\n    });\n  }, [user, creatorMode]);\n\n  async function openEvent(event: NotificationEvent) {\n    if (!user) return;\n    try {\n      await updateDoc(doc(db, "users", user.uid, "notificationEvents", event.id), { read: true, readAt: serverTimestamp() });\n    } catch (error) {\n      console.warn("Tiny Titans: notification could not be marked read", error);\n    }\n    if (event.url) navigate(event.url);\n  }\n\n  if (!user || events.length === 0) return null;\n  const latest = events[0];\n  const extra = events.length - 1;\n\n  return (\n    <section className="tt-notification-center" role="status" aria-live="polite">\n      <div className="tt-notification-icon" aria-hidden="true">🔔</div>\n      <div className="tt-notification-copy">\n        <strong>{latest.title || "Tiny Titans notification"}</strong>\n        <p>{latest.body || "You have a new Tiny Titans message."}</p>\n        {extra > 0 && <small>{extra} more notification{extra === 1 ? "" : "s"} waiting.</small>}\n      </div>\n      <button type="button" className="tt-notification-view" onClick={() => void openEvent(latest)}>View</button>\n    </section>\n  );\n}\n''')

          write('src/styles/notificationCenter.css', '''.tt-notification-center {\n  display: flex;\n  align-items: center;\n  gap: 14px;\n  margin: 12px 0 16px;\n  padding: 14px 16px;\n  border: 1px solid var(--tt-border, rgba(255,255,255,.12));\n  border-radius: 16px;\n  background: var(--tt-panel, rgba(24,27,28,.94));\n  box-shadow: 0 10px 28px rgba(0,0,0,.18);\n}\n.tt-notification-icon { font-size: 1.35rem; flex: 0 0 auto; }\n.tt-notification-copy { min-width: 0; flex: 1; }\n.tt-notification-copy strong { display: block; margin-bottom: 3px; }\n.tt-notification-copy p { margin: 0; opacity: .82; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.tt-notification-copy small { display: block; margin-top: 4px; opacity: .62; }\n.tt-notification-view { flex: 0 0 auto; border: 0; border-radius: 10px; padding: 9px 14px; font-weight: 800; cursor: pointer; background: var(--tt-accent, #d5aa4b); color: #111315; }\n.tt-notification-view:hover { filter: brightness(1.05); }\n@media (max-width: 680px) { .tt-notification-center { align-items: flex-start; } .tt-notification-copy p { white-space: normal; } .tt-notification-view { align-self: center; } }\n''')

          p = Path('src/components/Layout/Layout.tsx')
          text = p.read_text(encoding='utf-8')
          if 'import NotificationCenter' not in text:
              text = text.replace('import CreatorStatusBar from "../CreatorStatusBar";\n', 'import CreatorStatusBar from "../CreatorStatusBar";\nimport NotificationCenter from "../NotificationCenter";\n', 1)
          if '<NotificationCenter />' not in text:
              text = text.replace('          <CreatorStatusBar />\n', '          <CreatorStatusBar />\n          <NotificationCenter />\n', 1)
          p.write_text(text, encoding='utf-8')

          # 5) Server-side support notification triggers: persist unread events and send FCM in the background.
          write('functions/supportNotifications.js', '''const { onDocumentCreated } = require("firebase-functions/v2/firestore");\nconst { getFirestore, FieldValue } = require("firebase-admin/firestore");\nconst { getMessaging } = require("firebase-admin/messaging");\n\nconst db = getFirestore();\nconst messaging = getMessaging();\nconst ORIGIN = "https://tinytitans-hoggy-companion.web.app";\n\nfunction clean(value) { return String(value || "").trim(); }\nfunction preview(value, max = 120) { const text = clean(value).replace(/\\s+/g, " "); return text.length > max ? `${text.slice(0, max - 1)}…` : text; }\n\nasync function getDisplayName(uid) {\n  const id = clean(uid);\n  if (!id) return "Anonymous user";\n  try {\n    const snapshot = await db.collection("users").doc(id).get();\n    const data = snapshot.data() || {};\n    return clean(data.displayName || data.name) || "Anonymous user";\n  } catch { return "Anonymous user"; }\n}\n\nasync function getCreatorUids() {\n  const snapshot = await db.collection("users").get();\n  return snapshot.docs.filter((doc) => {\n    const data = doc.data() || {};\n    return data.role === "admin" || data.role === "creator" || data.profileType === "creator";\n  }).map((doc) => doc.id);\n}\n\nasync function writeAndPush(targetUid, payload) {\n  const uid = clean(targetUid);\n  if (!uid) return;\n  const eventKey = `${payload.type}-${payload.kind}-${payload.relatedId}-${payload.messageId || "submission"}`;\n  await db.collection("users").doc(uid).collection("notificationEvents").doc(eventKey).set({\n    type: payload.type,\n    kind: payload.kind,\n    relatedId: payload.relatedId,\n    title: payload.title,\n    body: payload.body,\n    url: payload.url,\n    read: false,\n    createdAt: FieldValue.serverTimestamp(),\n  }, { merge: true });\n\n  try {\n    const tokenSnapshot = await db.collection("users").doc(uid).collection("notificationTokens").where("enabled", "==", true).get();\n    const tokens = tokenSnapshot.docs.map((doc) => clean(doc.data().token)).filter(Boolean);\n    if (!tokens.length) return;\n    const response = await messaging.sendEachForMulticast({\n      tokens,\n      notification: { title: payload.title, body: payload.body },\n      data: { title: payload.title, body: payload.body, url: payload.url, eventKey, notificationType: "support" },\n      webpush: { fcmOptions: { link: payload.url } },\n    });\n    const invalid = [];\n    response.responses.forEach((result, index) => {\n      const code = result.error?.code;\n      if (code === "messaging/registration-token-not-registered" || code === "messaging/invalid-registration-token") invalid.push(tokenSnapshot.docs[index].ref);\n    });\n    if (invalid.length) await Promise.all(invalid.map((ref) => ref.delete()));\n  } catch (error) {\n    console.warn("Tiny Titans support FCM delivery failed", error);\n  }\n}\n\nasync function notifyCreators(kind, relatedId, title, body) {\n  const creatorUids = await getCreatorUids();\n  await Promise.all(creatorUids.map((uid) => writeAndPush(uid, { type: "support-submission", kind, relatedId, title, body, url: `${ORIGIN}/creator/conversations?kind=${kind}&id=${encodeURIComponent(relatedId)}` })));\n}\n\nexports.notifyCreatorsOfBugReport = onDocumentCreated({ region: "europe-west2", document: "issueReports/{reportId}" }, async (event) => {\n  const report = event.data?.data() || {};\n  const reportId = clean(event.params.reportId);\n  if (!reportId) return;\n  const name = await getDisplayName(report.userId);\n  await notifyCreators("bug", reportId, "🐛 New bug report", `${name} submitted “${preview(report.title, 90)}”.`);\n});\n\nexports.notifyCreatorsOfFeedback = onDocumentCreated({ region: "europe-west2", document: "feedback/{feedbackId}" }, async (event) => {\n  const feedback = event.data?.data() || {};\n  const feedbackId = clean(event.params.feedbackId);\n  if (!feedbackId) return;\n  const name = await getDisplayName(feedback.userId);\n  await notifyCreators("feedback", feedbackId, "💡 New community feedback", `${name} submitted “${preview(feedback.title, 90)}”.`);\n});\n\nasync function notifyConversationMessage(kind, parentId, messageId, message) {\n  const parentCollection = kind === "bug" ? "issueReports" : "feedback";\n  const parentSnapshot = await db.collection(parentCollection).doc(parentId).get();\n  if (!parentSnapshot.exists) return;\n  const parent = parentSnapshot.data() || {};\n  const senderRole = clean(message.senderRole);\n  const parentTitle = preview(parent.title, 90) || "support conversation";\n  if (senderRole === "creator") {\n    const targetUid = clean(parent.userId);\n    if (!targetUid) return;\n    await writeAndPush(targetUid, { type: "support-message", kind, relatedId: parentId, messageId, title: "💬 You have a new message", body: `Tiny Titans replied to “${parentTitle}”.`, url: `${ORIGIN}/conversations?kind=${kind}&id=${encodeURIComponent(parentId)}` });\n    return;\n  }\n  if (senderRole !== "user") return;\n  const senderName = await getDisplayName(message.senderId);\n  const creatorUids = await getCreatorUids();\n  await Promise.all(creatorUids.map((uid) => writeAndPush(uid, { type: "support-message", kind, relatedId: parentId, messageId, title: `💬 Reply from ${senderName}`, body: `${senderName} replied to “${parentTitle}”: ${preview(message.message)}`, url: `${ORIGIN}/creator/conversations?kind=${kind}&id=${encodeURIComponent(parentId)}` })));\n}\n\nexports.notifyBugConversationMessage = onDocumentCreated({ region: "europe-west2", document: "issueReports/{reportId}/messages/{messageId}" }, async (event) => {\n  const message = event.data?.data() || {};\n  await notifyConversationMessage("bug", clean(event.params.reportId), clean(event.params.messageId), message);\n});\n\nexports.notifyFeedbackConversationMessage = onDocumentCreated({ region: "europe-west2", document: "feedback/{feedbackId}/messages/{messageId}" }, async (event) => {\n  const message = event.data?.data() || {};\n  await notifyConversationMessage("feedback", clean(event.params.feedbackId), clean(event.params.messageId), message);\n});\n''')

          p = Path('functions/index.js')
          text = p.read_text(encoding='utf-8')
          anchor = 'Object.assign(exports, require("./notificationTest"));\n'
          line = 'Object.assign(exports, require("./supportNotifications"));\n'
          if line not in text:
              if anchor not in text:
                  raise SystemExit('Could not find functions/index.js notification anchor')
              text = text.replace(anchor, anchor + line, 1)
          p.write_text(text, encoding='utf-8')
          print('Support/weight fixes applied.')
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint and production build
        run: |
          npm run lint
          npm run build

      - name: Validate Cloud Functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Commit fixes to master
        shell: bash
        run: |
          rm -f .github/workflows/tt-support-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions
          git add -u .github/workflows/tt-support-fix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: backfill weights and ship support notifications"
          git push origin HEAD:master
