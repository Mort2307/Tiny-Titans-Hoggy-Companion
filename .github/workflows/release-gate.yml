name: Tiny Titans Release Gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install official logo badge conversion support
        shell: bash
        run: |
          set -euo pipefail
          # Required to rasterise the actual owner's logo into an Android alpha badge.
          # The former bundled lightning bolt is explicitly disallowed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v convert
          convert -version | head -n 1

      - name: Install dependencies
        run: npm ci

      - name: Run release gate
        run: npm run test:production-gate

      - name: Dependency security audit
        run: npm audit
