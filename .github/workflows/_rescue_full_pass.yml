name: Rescue Centre Full Pass Installer
on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/_rescue_full_pass.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Apply Rescue Centre full pass
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          def R(p): return Path(p).read_text(encoding='utf-8')
          def W(p,s): Path(p).write_text(s,encoding='utf-8')

          W('src/types/rescue.ts', '''export type RescueAnimalStatus = "in_care" | "quarantine" | "under_observation" | "adopted" | "transferred" | "deceased";
export type RescueRole = "owner" | "manager" | "staff" | "medical" | "foster" | "viewer";
export type RescueTimelineType = "intake" | "feeding" | "weight" | "shed" | "husbandry" | "medical" | "behaviour" | "transfer" | "location" | "status" | "adoption" | "note";
export type RescueAccountType = "rescue";
export type RescueAccountStatus = "pilot_pending" | "pilot_active" | "pilot_expired" | "pilot_suspended" | "paid_active" | "cancelled";
export type RescueVisibility = "public" | "staff" | "medical";
export type RescueTimelineEvent = { id:string; type:RescueTimelineType; occurredAt:string; title:string; summary:string; details:string; recordedByUid:string; visibility:RescueVisibility };
export type RescueIntakeSource = "surrender" | "stray_found" | "rescue_transfer" | "owner_deceased" | "neglect" | "seizure" | "abandonment" | "private_rehome" | "other" | "unknown";
export type RescueIntakeRecord = { source:RescueIntakeSource; receivedAt:string; deliveredBy:string; deliveredByContact:string; reason:string; knownHistory:string; previousName:string; previousIdentifier:string; knownMedicalHistory:string; knownFeedingHistory:string; knownBehaviour:string; conditionOnArrival:string; quarantineReason:string; acceptedByUid:string; evidenceSummary:string };
export type RescueLifecycleEvent = { id:string; fromStatus:RescueAnimalStatus | null; toStatus:RescueAnimalStatus; occurredAt:string; reason:string; recordedByUid:string; visibility:RescueVisibility };
export type RescueLocationRecord = { id:string; occurredAt:string; facility:string; room:string; zone:string; enclosure:string; reason:string; recordedByUid:string; visibility:RescueVisibility };
export type RescueQuarantineRecord = { startedAt:string; reason:string; area:string; reviewAt:string; reviewedByUid:string; outcome:string; notes:string };
export type RescueCareRecordType = "feeding" | "weight" | "shed" | "health" | "behaviour" | "husbandry" | "note";
export type RescueCareRecord = { id:string; type:RescueCareRecordType; occurredAt:string; title:string; summary:string; details:string; recordedByUid:string; visibility:RescueVisibility; value?:number | null; unit?:string; accepted?:boolean | null; response?:string; foodType?:string; bodyCondition?:string };
export type RescueReminderPriority = "low" | "normal" | "high" | "urgent";
export type RescueReminder = { id:string; title:string; dueAt:string; kind:string; priority:RescueReminderPriority; completed:boolean; notes:string; createdByUid:string; assignedToUid?:string; completedAt?:string };
export type RescueTransferRecord = { id:string; occurredAt:string; direction:"incoming" | "outgoing"; organisationOrPerson:string; reason:string; reference:string; notes:string; recordedByUid:string; visibility:RescueVisibility; authorisingUid?:string; transportMethod?:string; handoverCondition?:string; receivedConfirmedAt?:string };
export type RescueFosterPlacement = { id:string; startedAt:string; endedAt?:string; fosterName:string; contact:string; notes:string; status:"active" | "ended"; recordedByUid:string; visibility:RescueVisibility; expectedReviewAt?:string; careInstructions?:string; emergencyInstructions?:string; returnReason?:string; endCondition?:string };
export type RescueDocument = { id:string; title:string; category:"medical" | "intake" | "transfer" | "adoption" | "compliance" | "other"; note:string; addedAt:string; addedByUid:string; visibility:RescueVisibility; relatedEventId?:string; evidenceStatus?:"unreviewed" | "reviewed" | "verified" };
export type RescueAnimal = { id:string; organisationId:string; publicPreview:boolean; name:string; rescueId?:string; microchipNumber?:string; secondaryIdentifier?:string; previousName?:string; previousIdentifier?:string; speciesCommonName:string; scientificName:string; sex:string; morphOrColour:string; estimatedAge:string; estimatedDob?:string; status:RescueAnimalStatus; intakeDate:string; enclosure:string; publicSummary:string; husbandrySummary:string; privateNotes:string; intakeRecord?:RescueIntakeRecord; lifecycle?:RescueLifecycleEvent[]; locations?:RescueLocationRecord[]; quarantine?:RescueQuarantineRecord; timeline:RescueTimelineEvent[]; careRecords?:RescueCareRecord[]; reminders?:RescueReminder[]; transfers?:RescueTransferRecord[]; fosterPlacements?:RescueFosterPlacement[]; documents?:RescueDocument[]; createdAt:string; updatedAt:string };
export type RescueOrganisation = { id:string; accountType:RescueAccountType; accountStatus:RescueAccountStatus; name:string; ownerUid:string; managerUids:string[]; staffUids:string[]; medicalUids:string[]; fosterUids:string[]; viewerUids:string[]; speciesDiscovered:string[]; website?:string; contactEmail?:string; phone?:string; charityNumber?:string; companyNumber?:string; localAuthorityLicence?:string; otherRegistrationNumber?:string; registrationAuthority?:string; registrationNotes?:string; registrationEvidenceUrl?:string; registrationsPublic?:boolean; pilotStatus?:RescueAccountStatus; pilotStartsAt?:string; pilotEndsAt?:string; staffLimit?:number; animalLimit?:number; storageMbLimit?:number; createdAt:string; updatedAt:string };
export type RescueAccess = { role:RescueRole|null; canViewFullHistory:boolean; canEdit:boolean; canManageOrganisation:boolean; isMember:boolean };
''')

          p='src/services/rescueService.ts'; s=R(p)
          s=s.replace('function normaliseOrganisation(id: string, data: Record<string, unknown>): RescueOrganisation { return { ...(data as Omit<RescueOrganisation, "id">), id, managerUids:', 'function normaliseOrganisation(id: string, data: Record<string, unknown>): RescueOrganisation { return { ...(data as Omit<RescueOrganisation, "id">), id, website:String(data.website||""), contactEmail:String(data.contactEmail||""), phone:String(data.phone||""), charityNumber:String(data.charityNumber||""), companyNumber:String(data.companyNumber||""), localAuthorityLicence:String(data.localAuthorityLicence||""), otherRegistrationNumber:String(data.otherRegistrationNumber||""), registrationAuthority:String(data.registrationAuthority||""), registrationNotes:String(data.registrationNotes||""), registrationEvidenceUrl:String(data.registrationEvidenceUrl||""), registrationsPublic:data.registrationsPublic!==false, managerUids:')
          s=s.replace('return { ...(data as Omit<RescueAnimal, "id">), id, timeline:', 'return { ...(data as Omit<RescueAnimal, "id">), id, name:String(data.name||""), rescueId:String(data.rescueId||"")||undefined, microchipNumber:String(data.microchipNumber||"")||undefined, secondaryIdentifier:String(data.secondaryIdentifier||"")||undefined, previousName:String(data.previousName||"")||undefined, previousIdentifier:String(data.previousIdentifier||"")||undefined, speciesCommonName:String(data.speciesCommonName||""), scientificName:String(data.scientificName||""), timeline:')
          s=s.replace('name: String(data.name || "Rescue animal"), speciesCommonName: String(data.speciesCommonName || "Species awaiting identification")', 'name: String(data.name || ""), rescueId: String(data.rescueId || "") || undefined, secondaryIdentifier: String(data.secondaryIdentifier || "") || undefined, previousName: String(data.previousName || "") || undefined, previousIdentifier: String(data.previousIdentifier || "") || undefined, speciesCommonName: String(data.speciesCommonName || "")')
          s=s.replace('publicPreview: true, name: animal.name, speciesCommonName:', 'publicPreview: true, name: animal.name, rescueId: animal.rescueId || "", secondaryIdentifier: animal.secondaryIdentifier || "", speciesCommonName:')
          s=re.sub(r'export async function updateRescueAnimal\(id: string, patch: Partial<Pick<RescueAnimal,[^\n]+\)\>)', 'export async function updateRescueAnimal(id: string, patch: Partial<RescueAnimal>)', s)
          W(p,s)

          p='src/services/rescueWorkspaceService.ts'; s=R(p)
          s=s.replace('name: String(item.name || "TinyTitans Rescue"), ownerUid:', 'name: String(item.name || "My Rescue Centre"), ownerUid:')
          s=s.replace('speciesDiscovered: list("speciesDiscovered"), pilotStatus:', 'speciesDiscovered: list("speciesDiscovered"), website:String(item.website||""), contactEmail:String(item.contactEmail||""), phone:String(item.phone||""), charityNumber:String(item.charityNumber||""), companyNumber:String(item.companyNumber||""), localAuthorityLicence:String(item.localAuthorityLicence||""), otherRegistrationNumber:String(item.otherRegistrationNumber||""), registrationAuthority:String(item.registrationAuthority||""), registrationNotes:String(item.registrationNotes||""), registrationEvidenceUrl:String(item.registrationEvidenceUrl||""), registrationsPublic:item.registrationsPublic!==false, pilotStatus:')
          W(p,s)

          p='functions/rescueOrganisation.js'; s=R(p)
          s=s.replace('name:String(data.name||"TinyTitans Rescue")','name:String(data.name||"My Rescue Centre")')
          s=s.replace('speciesDiscovered:Array.isArray(data.speciesDiscovered)?data.speciesDiscovered:[],staffLimit:', 'speciesDiscovered:Array.isArray(data.speciesDiscovered)?data.speciesDiscovered:[],website:String(data.website||""),contactEmail:String(data.contactEmail||""),phone:String(data.phone||""),charityNumber:String(data.charityNumber||""),companyNumber:String(data.companyNumber||""),localAuthorityLicence:String(data.localAuthorityLicence||""),otherRegistrationNumber:String(data.otherRegistrationNumber||""),registrationAuthority:String(data.registrationAuthority||""),registrationNotes:String(data.registrationNotes||""),registrationEvidenceUrl:String(data.registrationEvidenceUrl||""),registrationsPublic:data.registrationsPublic!==false,staffLimit:')
          W(p,s)

          p='src/services/rescueDirectoryService.ts'; s=R(p)
          s=s.replace('pilot: boolean;', 'pilot: boolean; charityNumber: string; companyNumber: string; localAuthorityLicence: string; otherRegistrationNumber: string; registrationAuthority: string; registrationsPublic: boolean;')
          s=s.replace('directoryVisible?: boolean;', 'directoryVisible?: boolean; charityNumber?: string; companyNumber?: string; localAuthorityLicence?: string; otherRegistrationNumber?: string; registrationAuthority?: string; registrationNotes?: string; registrationEvidenceUrl?: string; registrationsPublic?: boolean;')
          W(p,s)

          p='functions/rescueDirectory.js'; s=R(p)
          s=s.replace('speciesDiscovered: Array.isArray(data.speciesDiscovered) ? data.speciesDiscovered : [], pilot:', 'speciesDiscovered: Array.isArray(data.speciesDiscovered) ? data.speciesDiscovered : [], charityNumber: data.registrationsPublic === false ? "" : String(data.charityNumber || ""), companyNumber: data.registrationsPublic === false ? "" : String(data.companyNumber || ""), localAuthorityLicence: data.registrationsPublic === false ? "" : String(data.localAuthorityLicence || ""), otherRegistrationNumber: data.registrationsPublic === false ? "" : String(data.otherRegistrationNumber || ""), registrationAuthority: data.registrationsPublic === false ? "" : String(data.registrationAuthority || ""), registrationsPublic: data.registrationsPublic !== false, pilot:')
          old='logoUrl: String(request.data?.logoUrl || "").trim(), directoryVisible: request.data?.directoryVisible !== false, updatedAt:'
          new='logoUrl: String(request.data?.logoUrl || "").trim(), charityNumber: String(request.data?.charityNumber || "").trim(), companyNumber: String(request.data?.companyNumber || "").trim(), localAuthorityLicence: String(request.data?.localAuthorityLicence || "").trim(), otherRegistrationNumber: String(request.data?.otherRegistrationNumber || "").trim(), registrationAuthority: String(request.data?.registrationAuthority || "").trim(), registrationNotes: String(request.data?.registrationNotes || "").trim(), registrationEvidenceUrl: String(request.data?.registrationEvidenceUrl || "").trim(), registrationsPublic: request.data?.registrationsPublic !== false, directoryVisible: request.data?.directoryVisible !== false, updatedAt:'
          s=s.replace(old,new)
          W(p,s)

          p='src/pages/RescueDirectoryProfile.tsx'; s=R(p)
          s=s.replace('const [directoryVisible, setDirectoryVisible] = useState(true);', 'const [directoryVisible, setDirectoryVisible] = useState(true); const [charityNumber,setCharityNumber]=useState(""); const [companyNumber,setCompanyNumber]=useState(""); const [localAuthorityLicence,setLocalAuthorityLicence]=useState(""); const [otherRegistrationNumber,setOtherRegistrationNumber]=useState(""); const [registrationAuthority,setRegistrationAuthority]=useState(""); const [registrationNotes,setRegistrationNotes]=useState(""); const [registrationEvidenceUrl,setRegistrationEvidenceUrl]=useState(""); const [registrationsPublic,setRegistrationsPublic]=useState(true);')
          s=s.replace('setDirectoryVisible(data.directoryVisible !== false);', 'setDirectoryVisible(data.directoryVisible !== false); setCharityNumber(String(data.charityNumber||"")); setCompanyNumber(String(data.companyNumber||"")); setLocalAuthorityLicence(String(data.localAuthorityLicence||"")); setOtherRegistrationNumber(String(data.otherRegistrationNumber||"")); setRegistrationAuthority(String(data.registrationAuthority||"")); setRegistrationNotes(String(data.registrationNotes||"")); setRegistrationEvidenceUrl(String(data.registrationEvidenceUrl||"")); setRegistrationsPublic(data.registrationsPublic!==false);')
          s=s.replace('directoryVisible });', 'directoryVisible, charityNumber, companyNumber, localAuthorityLicence, otherRegistrationNumber, registrationAuthority, registrationNotes, registrationEvidenceUrl, registrationsPublic });')
          marker='<label className="rescue-check"><input type="checkbox" checked={directoryVisible} onChange={(e) => setDirectoryVisible(e.target.checked)}/> Show this Rescue in the public directory</label>'
          block='<section className="rescue-card"><span className="rescue-eyebrow">OFFICIAL REGISTRATIONS</span><h2>Rescue compliance details</h2><p className="rescue-form-hint">Optional. Add only the registrations, licences or permits your organisation actually holds. Entered numbers are not automatically verified by TinyTitans.</p><div className="rescue-form-grid"><label>Charity registration number<input value={charityNumber} onChange={e=>setCharityNumber(e.target.value)} placeholder="Optional" /></label><label>Company registration number<input value={companyNumber} onChange={e=>setCompanyNumber(e.target.value)} placeholder="Optional" /></label><label>Local authority licence number<input value={localAuthorityLicence} onChange={e=>setLocalAuthorityLicence(e.target.value)} placeholder="Optional" /></label><label>Other permit / registration number<input value={otherRegistrationNumber} onChange={e=>setOtherRegistrationNumber(e.target.value)} placeholder="Optional" /></label><label>Issuing authority<input value={registrationAuthority} onChange={e=>setRegistrationAuthority(e.target.value)} placeholder="Optional" /></label><label>Evidence / verification link<input value={registrationEvidenceUrl} onChange={e=>setRegistrationEvidenceUrl(e.target.value)} placeholder="Optional URL" /></label><label className="rescue-form-grid-span">Registration notes<textarea value={registrationNotes} onChange={e=>setRegistrationNotes(e.target.value)} placeholder="Optional issue, expiry or verification context…" /></label></div><label className="rescue-check"><input type="checkbox" checked={registrationsPublic} onChange={e=>setRegistrationsPublic(e.target.checked)} /> Allow these registration details on the public Rescue profile</label></section>'+marker
          s=s.replace(marker,block)
          W(p,s)

          p='src/pages/RescuePages.tsx'; s=R(p)
          s=s.replace('function rescueId(id: string) { return `TT-RC-${id.slice(0, 8).toUpperCase()}`; }', 'function rescueIdentity(animal: RescueAnimal) { return animal.rescueId?.trim() || animal.name?.trim() || "Animal record"; }\nfunction animalLabel(animal: RescueAnimal) { const name=animal.name?.trim(); const id=animal.rescueId?.trim(); return name && id ? `${name} · ${id}` : name || id || "Animal identity not recorded"; }')
          s=s.replace('const [name, setName] = useState(""); const [species, setSpecies] = useState("");', 'const [name, setName] = useState(""); const [rescueId, setRescueId] = useState(""); const [microchipNumber, setMicrochipNumber] = useState(""); const [secondaryIdentifier, setSecondaryIdentifier] = useState(""); const [species, setSpecies] = useState("");')
          s=s.replace('const cleanName = name.trim(); const cleanSpecies = species.trim(); if (!cleanName || !cleanSpecies) return setMessage("Animal name and species are required. Use “awaiting identification” rather than guessing.");', 'const cleanName = name.trim(); const cleanRescueId = rescueId.trim(); const cleanSpecies = species.trim(); if(cleanName.length>120||cleanRescueId.length>80) return setMessage("Check the animal name or Rescue ID length.");')
          s=s.replace('publicPreview, name: cleanName, speciesCommonName:', 'publicPreview, name: cleanName, rescueId: cleanRescueId || undefined, microchipNumber: microchipNumber.trim() || undefined, secondaryIdentifier: secondaryIdentifier.trim() || undefined, speciesCommonName: cleanSpecies,')
          s=s.replace('setName(""); setSpecies("");', 'setName(""); setRescueId(""); setMicrochipNumber(""); setSecondaryIdentifier(""); setSpecies("");')
          s=s.replace('[animal.name, animal.speciesCommonName, animal.scientificName, animal.enclosure, animal.status]', '[animal.name, animal.rescueId, animal.microchipNumber, animal.secondaryIdentifier, animal.speciesCommonName, animal.scientificName, animal.enclosure, animal.status]')
          s=s.replace('placeholder="Animal name or intake ID" required', 'placeholder="Optional"')
          s=s.replace('<label>Species<input value={species} onChange={(e) => setSpecies(e.target.value)} placeholder="Species or awaiting identification" required /></label>', '<label>Rescue animal ID<input value={rescueId} onChange={e=>setRescueId(e.target.value)} placeholder="Optional — rescue-owned ID / tag" /></label><label>Microchip / permanent identifier<input value={microchipNumber} onChange={e=>setMicrochipNumber(e.target.value)} placeholder="Optional" /></label><label>Secondary identifier<input value={secondaryIdentifier} onChange={e=>setSecondaryIdentifier(e.target.value)} placeholder="Optional" /></label><label>Species<input value={species} onChange={e=>setSpecies(e.target.value)} placeholder="Optional — leave blank while identifying" /></label>')
          s=s.replace('<strong>{animal.name}</strong><small>{animal.speciesCommonName} · {statusLabels[animal.status]} · {animal.enclosure || "No enclosure"}</small>', '<strong>{animalLabel(animal)}</strong><small>{animal.speciesCommonName || "Species identification pending"} · {statusLabels[animal.status]} · {animal.enclosure || "No enclosure"}</small>')
          s=s.replace('<h1><TinyTitansIcon name="reptile" size={35}/> {animal.name}</h1><p>{animal.speciesCommonName}', '<h1><TinyTitansIcon name="reptile" size={35}/> {rescueIdentity(animal)}</h1><p>{animal.speciesCommonName || "Species identification pending"}')
          s=s.replace('<div><small>Sex</small><strong>{animal.sex || "Unknown"}</strong></div>', '<div><small>Name</small><strong>{animal.name || "Not recorded"}</strong></div><div><small>Rescue animal ID</small><strong>{animal.rescueId || "Not recorded"}</strong></div><div><small>Sex</small><strong>{animal.sex || "Unknown"}</strong></div>')
          s=s.replace('<h2>{rescueId(animal.id)}</h2><p>QR data resolves', '<h2>{rescueIdentity(animal)}</h2><p>QR data resolves')
          s=s.replace('<h1>{rescueId(animal.id)}</h1><p>{animal.name} · {animal.speciesCommonName}</p>', '<h1>{rescueIdentity(animal)}</h1><p>{animal.name || "Name not recorded"} · {animal.speciesCommonName || "Species identification pending"}{animal.rescueId && animal.name ? ` · ID ${animal.rescueId}` : ""}</p>')
          edit='<Link className="rescue-primary-link" to={`/rescue/animals/${animal.id}/qr`}>QR identity →</Link>'
          s=s.replace(edit, '<Link className="rescue-primary-link" to={`/rescue/animals/${animal.id}/identity`}>Edit identity →</Link>'+edit)
          W(p,s)

          W('src/pages/RescueAnimalIdentityEditor.tsx', '''import { useEffect, useState } from "react";
import { Link, useNavigate, useParams } from "react-router-dom";
import PaidTierGate from "../components/PaidTierGate";
import { useAuth } from "../context/useAuth";
import { getRescueAccess, getRescueAnimal, getRescueOrganisation, updateRescueAnimal } from "../services/rescueService";
import type { RescueAnimal, RescueOrganisation } from "../types/rescue";
import "../styles/rescue.css";
export default function RescueAnimalIdentityEditor(){
 const {animalId}=useParams<{animalId:string}>(); const {user}=useAuth(); const navigate=useNavigate(); const [animal,setAnimal]=useState<RescueAnimal|null>(null); const [org,setOrg]=useState<RescueOrganisation|null>(null); const [saving,setSaving]=useState(false); const [message,setMessage]=useState("");
 const [name,setName]=useState(""); const [rescueId,setRescueId]=useState(""); const [microchip,setMicrochip]=useState(""); const [secondary,setSecondary]=useState(""); const [previousName,setPreviousName]=useState(""); const [previousId,setPreviousId]=useState(""); const [species,setSpecies]=useState(""); const [scientific,setScientific]=useState(""); const [sex,setSex]=useState(""); const [morph,setMorph]=useState(""); const [age,setAge]=useState(""); const [dob,setDob]=useState("");
 useEffect(()=>{if(!animalId)return; void getRescueAnimal(animalId).then(async item=>{setAnimal(item);if(item){setOrg(await getRescueOrganisation(item.organisationId));setName(item.name||"");setRescueId(item.rescueId||"");setMicrochip(item.microchipNumber||"");setSecondary(item.secondaryIdentifier||"");setPreviousName(item.previousName||"");setPreviousId(item.previousIdentifier||"");setSpecies(item.speciesCommonName||"");setScientific(item.scientificName||"");setSex(item.sex||"");setMorph(item.morphOrColour||"");setAge(item.estimatedAge||"");setDob(item.estimatedDob||"");}}).catch(e=>setMessage(e instanceof Error?e.message:"Could not load the animal record."));},[animalId]);
 const access=getRescueAccess(org,user?.uid);
 async function save(){if(!animalId||!animal||!access.canEdit)return setMessage("You do not have permission to edit this animal.");setSaving(true);setMessage("");try{await updateRescueAnimal(animalId,{name:name.trim(),rescueId:rescueId.trim()||undefined,microchipNumber:microchip.trim()||undefined,secondaryIdentifier:secondary.trim()||undefined,previousName:previousName.trim()||undefined,previousIdentifier:previousId.trim()||undefined,speciesCommonName:species.trim(),scientificName:scientific.trim(),sex:sex.trim()||"Unknown",morphOrColour:morph.trim(),estimatedAge:age.trim(),estimatedDob:dob.trim()||undefined});navigate(`/rescue/animals/${animalId}`);}catch(e){setMessage(e instanceof Error?e.message:"Could not save the identity record.");}finally{setSaving(false);}}
 return <PaidTierGate entitlement="rescue_workspace"><main className="rescue-page"><header className="rescue-subhead"><Link to={`/rescue/animals/${animalId}`}>← Animal passport</Link><div><span className="rescue-eyebrow">ANIMAL IDENTITY</span><h1>Edit animal identity</h1><p>The animal name and Rescue ID are independent optional fields. TinyTitans never assigns the Rescue animal ID.</p></div></header>{message&&<div className="rescue-message" role="status">{message}</div>}<section className="rescue-card"><div className="rescue-form-grid"><label>Reptile name<input value={name} onChange={e=>setName(e.target.value)} placeholder="Optional" /></label><label>Rescue animal ID<input value={rescueId} onChange={e=>setRescueId(e.target.value)} placeholder="Optional — rescue-owned" /></label><label>Microchip / permanent identifier<input value={microchip} onChange={e=>setMicrochip(e.target.value)} placeholder="Optional" /></label><label>Secondary identifier<input value={secondary} onChange={e=>setSecondary(e.target.value)} placeholder="Optional" /></label><label>Previous name<input value={previousName} onChange={e=>setPreviousName(e.target.value)} placeholder="Optional" /></label><label>Previous identifier<input value={previousId} onChange={e=>setPreviousId(e.target.value)} placeholder="Optional" /></label><label>Species<input value={species} onChange={e=>setSpecies(e.target.value)} placeholder="Leave blank while identification is pending" /></label><label>Scientific name<input value={scientific} onChange={e=>setScientific(e.target.value)} placeholder="Optional" /></label><label>Sex<input value={sex} onChange={e=>setSex(e.target.value)} placeholder="Unknown / optional" /></label><label>Morph / colour / pattern<input value={morph} onChange={e=>setMorph(e.target.value)} placeholder="Optional" /></label><label>Estimated age<input value={age} onChange={e=>setAge(e.target.value)} placeholder="Optional" /></label><label>Estimated date of birth<input type="date" value={dob} onChange={e=>setDob(e.target.value)} /></label></div><p className="rescue-form-hint">Unknown is valid data. Do not replace an unknown value with a guess merely to complete the record.</p><div className="rescue-form-actions"><button type="button" onClick={()=>void save()} disabled={saving}>{saving?"Saving…":"Save identity"}</button><Link className="rescue-primary-link" to={`/rescue/animals/${animalId}/manage`}>Open full workspace →</Link></div></section></main></PaidTierGate>;
}
''')

          p='src/routes/AppRouter.tsx'; s=R(p)
          s=s.replace('import { RescueCentre, RescueAnimals, RescueAnimalPassport, RescueAnimalManage, RescueAnimalQR, RescueQRCodeCentre, RescueScanner, RescueSpeciesIncubator, RescueOperationalPage } from "../pages/RescuePages";', 'import { RescueCentre, RescueAnimals, RescueAnimalPassport, RescueAnimalManage, RescueAnimalQR, RescueQRCodeCentre, RescueScanner, RescueSpeciesIncubator, RescueOperationalPage } from "../pages/RescuePages";\nimport RescueAnimalIdentityEditor from "../pages/RescueAnimalIdentityEditor";')
          s=s.replace('<Route path="/rescue/animals/:animalId/manage" element={<RescueAnimalManage/>}/>', '<Route path="/rescue/animals/:animalId/manage" element={<RescueAnimalManage/>}/><Route path="/rescue/animals/:animalId/identity" element={<RescueAnimalIdentityEditor/>}/>')
          W(p,s)

          Path('.github/workflows/_rescue_full_pass.yml').unlink(missing_ok=True)
          PY
      - name: Commit Rescue Centre full pass
        run: |
          git config user.name "TinyTitans Rescue Upgrade"
          git config user.email "tinytitans.exotics@gmail.com"
          git add src functions .github/workflows/_rescue_full_pass.yml
          git diff --cached --quiet && exit 0
          git commit -m "Expand Rescue Centre identity and compliance workflows"
          git push origin master
