name: Bird PR one-time dependency audit refresh
on:
  push:
    branches:
      - feature/expanded-bird-catalogue-20261024
    paths:
      - .github/workflows/bird-dependency-refresh.yml
permissions:
  contents: write
jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Apply nonbreaking npm audit fixes to lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Verify lockfile reproducibility
        run: npm ci --ignore-scripts
      - name: Require clean dependency audit
        run: npm audit
      - name: Commit lockfile-only refresh
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): refresh vulnerable transitive packages without forced upgrades"
          git push origin HEAD:feature/expanded-bird-catalogue-20261024
