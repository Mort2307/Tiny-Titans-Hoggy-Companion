name: Tiny Titans Universal Visual Capture BOT

on:
  workflow_dispatch:
    inputs:
      routes:
        description: "Routes to capture, comma-separated (for example: /,/snakes,/feeding)"
        required: true
        default: "/"
      note:
        description: "Optional reason/context for this visual capture run"
        required: false
        default: ""
  workflow_run:
    workflows: ["Tiny Titans CI"]
    types: [completed]

permissions:
  contents: read

env:
  VISUAL_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '/' }}

jobs:
  capture:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || 'master' }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start preview server
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > ci-visual-capture-server.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat ci-visual-capture-server.log
          exit 1

      - name: Capture requested rendered pages
        env:
          TINY_TITANS_TEST_URL: http://127.0.0.1:4173
          TINY_TITANS_VISUAL_ROUTES: ${{ env.VISUAL_ROUTES }}
          TINY_TITANS_VISUAL_BOT_EMAIL: ${{ secrets.TINY_TITANS_BOT_EMAIL }}
          TINY_TITANS_VISUAL_BOT_PASSWORD: ${{ secrets.TINY_TITANS_BOT_PASSWORD }}
        run: node scripts/run-visual-capture-bot.mjs

      - name: Write capture metadata
        shell: bash
        env:
          VISUAL_ROUTES: ${{ env.VISUAL_ROUTES }}
          VISUAL_NOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.note || 'Automatic capture after successful Tiny Titans CI' }}
        run: |
          cat > artifacts/visual-capture/run-metadata.txt <<EOF
          Tiny Titans Universal Visual Capture BOT
          Routes: ${VISUAL_ROUTES}
          Context: ${VISUAL_NOTE}
          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_RUN_ID}
          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

      - name: Upload rendered visual artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tiny-titans-visual-capture-${{ github.run_id }}
          path: |
            artifacts/visual-capture/
            ci-visual-capture-server.log
          if-no-files-found: warn
