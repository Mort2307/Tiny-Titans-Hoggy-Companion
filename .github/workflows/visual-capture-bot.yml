name: Tiny Titans Visual Review BOT

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'scripts/run-visual-review-bot.mjs'
      - 'scripts/run-visual-journey-recorder.mjs'
      - 'docs/visual-design-contract.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/visual-capture-bot.yml'
  workflow_dispatch:
    inputs:
      routes:
        description: "Routes to capture, comma-separated (for example: /,/rescue,/weights)"
        required: true
        default: "/,/rescue,/rescue/animals,/rescue/qr,/weights,/feeding"
      note:
        description: "Optional reason/context for this visual review run"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: tiny-titans-visual-review-${{ github.ref }}
  cancel-in-progress: true

env:
  VISUAL_ROUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.routes || '/,/rescue,/rescue/animals,/rescue/qr,/weights,/feeding' }}

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Start preview server
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > ci-visual-review-server.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat ci-visual-review-server.log
          exit 1

      - name: Capture rendered screenshots and DOM evidence
        env:
          TINY_TITANS_TEST_URL: http://127.0.0.1:4173
          TINY_TITANS_VISUAL_ROUTES: ${{ env.VISUAL_ROUTES }}
          TINY_TITANS_VISUAL_BOT_EMAIL: ${{ secrets.TINY_TITANS_BOT_EMAIL }}
          TINY_TITANS_VISUAL_BOT_PASSWORD: ${{ secrets.TINY_TITANS_BOT_PASSWORD }}
        run: node scripts/run-visual-review-bot.mjs

      - name: Record rendered viewport journeys
        env:
          TINY_TITANS_TEST_URL: http://127.0.0.1:4173
          TINY_TITANS_VISUAL_ROUTES: ${{ env.VISUAL_ROUTES }}
          TINY_TITANS_VISUAL_BOT_EMAIL: ${{ secrets.TINY_TITANS_BOT_EMAIL }}
          TINY_TITANS_VISUAL_BOT_PASSWORD: ${{ secrets.TINY_TITANS_BOT_PASSWORD }}
        run: node scripts/run-visual-journey-recorder.mjs

      - name: Write run metadata
        shell: bash
        env:
          VISUAL_ROUTES: ${{ env.VISUAL_ROUTES }}
          VISUAL_NOTE: ${{ github.event_name == 'workflow_dispatch' && inputs.note || 'Automatic visual review after UI/application changes' }}
        run: |
          cat > artifacts/visual-review/run-metadata.txt <<EOF
          Tiny Titans Visual Review BOT
          Routes: ${VISUAL_ROUTES}
          Context: ${VISUAL_NOTE}
          Commit: ${GITHUB_SHA}
          Run: ${GITHUB_RUN_ID}
          Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Evidence: viewport screenshots, full-page screenshots, DOM metrics, runtime errors and WebM viewport journey recordings.
          EOF

      - name: Upload rendered visual evidence
        id: upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tiny-titans-visual-review-${{ github.run_id }}
          path: |
            artifacts/visual-review/
            ci-visual-review-server.log
          if-no-files-found: warn

      - name: Link visual evidence from the run summary
        if: ${{ always() }}
        shell: bash
        run: |
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Rendered evidence" >> "$GITHUB_STEP_SUMMARY"
          echo "[Open / download the visual review artifact](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts/${{ steps.upload.outputs.artifact-id }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The artifact contains per-route viewport/full-page PNGs, DOM/runtime evidence, and mobile/tablet/desktop WebM journey recordings." >> "$GITHUB_STEP_SUMMARY"
