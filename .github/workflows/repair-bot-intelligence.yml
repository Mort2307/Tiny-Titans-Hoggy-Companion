name: Repair bot intelligence service

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor == 'Mort2307'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair TypeScript issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/services/botIntelligenceService.ts')
          s = p.read_text()
          s = s.replace('return candidates.map((element, index) => {', 'return candidates.map((element) => {')
          s = s.replace('}).filter((item): item is Region => Boolean(item) && item.visible && item.rect.width >= 100 && item.rect.height >= 40 && indexSafe(item!));\n}\n\nfunction indexSafe(region: Region): boolean {\n  return Boolean(region.element);\n}', '}).filter((item): item is Region =>\n    item !== null &&\n    item.visible &&\n    item.rect.width >= 100 &&\n    item.rect.height >= 40\n  );\n}')
          s = s.replace('  const wordCount = visibleText ? visibleText.split(/\\s+/).length : 0;', '  const wordCount = visibleText ? visibleText.split(/\\s+/).length : 0;')
          old = 'const firstViewportActionRatio = firstViewportInteractive.length ? strongActions.filter(item => isInFirstViewport(viewportRect(item.element))).length / firstViewportInteractive.length : 0;'
          new = 'const firstViewportActionRatio = firstViewportInteractive.length ? strongActions.filter(item => isInFirstViewport(viewportRect(item.element))).length / firstViewportInteractive.length : 0;'
          s = s.replace(old, new)
          old_block = 'evidence: `${interactive.length} visible interactive controls were found, but none has enough contextual, semantic and visual evidence to be identified as a strong primary action.`,'
          new_block = 'evidence: `${interactive.length} visible interactive controls were found, but none has enough contextual, semantic and visual evidence to be identified as a strong primary action. Only ${Math.round(firstViewportActionRatio * 100)}% of opening-viewport interactive controls are strongly associated with the primary task.`,'
          s = s.replace(old_block, new_block)
          old_word = 'if (verticalHeight > window.innerHeight * 6 && profile.pattern !== "timeline" && profile.pattern !== "field-guide") findings.push({'
          if old_word in s:
              marker = 'evidence: `Rendered document height is ${verticalHeight}px (${(verticalHeight / window.innerHeight).toFixed(1)} viewport heights)`,'
              s = s.replace(marker, 'evidence: `Rendered document height is ${verticalHeight}px (${(verticalHeight / window.innerHeight).toFixed(1)} viewport heights) and contains approximately ${wordCount} words of visible content.`,')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name "Tiny Titans Repair Bot"
          git config user.email "actions@github.com"
          git add src/services/botIntelligenceService.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: repair bot intelligence TypeScript errors"
          git push
