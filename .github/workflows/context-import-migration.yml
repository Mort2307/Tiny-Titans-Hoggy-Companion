name: One-time context import migration
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[context-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
      - name: Move hook imports to Fast Refresh-safe modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'} or path.name in {'AuthContext.tsx','UnitContext.tsx','AuthContextValue.ts','UnitContextValue.ts','useAuth.ts'}:
                  continue
              text=path.read_text(); lines=[]; changed=False
              for line in text.splitlines(keepends=True):
                  new=line
                  if 'useAuth' in line and 'context/AuthContext' in new: new=new.replace('context/AuthContext','context/useAuth')
                  if 'useUnits' in line and 'context/UnitContext' in new: new=new.replace('context/UnitContext','context/UnitContextValue')
                  changed=changed or new!=line; lines.append(new)
              if changed: path.write_text(''.join(lines))
          PY
          git config user.name 'tiny-titans-lint-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'refactor: migrate context hook imports [context-migration]'
          git push origin master
