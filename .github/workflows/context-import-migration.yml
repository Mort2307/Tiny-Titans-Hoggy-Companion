name: One-time context import migration
on:
  push:
    branches:
      - chore/lint-zero-hardening
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[context-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lint-zero-hardening
          fetch-depth: 0
      - name: Move hook imports to Fast Refresh-safe modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in Path('src').rglob('*'):
              if path.suffix not in {'.ts', '.tsx'}:
                  continue
              if path.name in {'AuthContext.tsx', 'UnitContext.tsx', 'AuthContextValue.ts', 'UnitContextValue.ts', 'useAuth.ts'}:
                  continue
              text = path.read_text()
              lines = []
              changed = False
              for line in text.splitlines(keepends=True):
                  new_line = line
                  if 'useAuth' in line and 'context/AuthContext' in new_line:
                      new_line = new_line.replace('context/AuthContext', 'context/useAuth')
                  if 'useUnits' in line and 'context/UnitContext' in new_line:
                      new_line = new_line.replace('context/UnitContext', 'context/UnitContextValue')
                  changed = changed or new_line != line
                  lines.append(new_line)
              if changed:
                  path.write_text(''.join(lines))
          PY
          git config user.name 'tiny-titans-lint-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src
          if git diff --cached --quiet; then
            echo 'No import migration required.'
            exit 0
          fi
          git commit -m 'refactor: migrate context hook imports [context-migration]'
          git push origin chore/lint-zero-hardening
          rm -f .github/workflows/context-import-migration.yml
