name: Tiny Titans Release Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        command:
          - validate:morphs
          - validate:morph-taxonomy
          - validate:morph-sources
          - validate:morph-integrity
          - validate:morph-intelligence
          - validate:species
          - validate:species-husbandry
          - validate:species-evidence
          - validate:species-genetics
          - validate:species-genetics-coverage
          - validate:species-genetics-audit
          - validate:species-genetics-search
          - validate:species-genetics-v3
          - validate:species-integration
          - validate:submissions
          - validate:breeding-bridge
          - validate:app-health
          - validate:learning
          - validate:routes
          - validate:route-coverage
          - validate:v50-routes
          - validate:v50-runtime
          - validate:encoding
          - validate:copy-quality
          - validate:security
          - validate:ui-hardening
          - validate:observatory
          - validate:genetics-calculator-v2
          - test:intelligence:consent
          - test:intelligence:journey
          - test:intelligence:proactive
          - test:notifications
          - test:room-photo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run ${{ matrix.command }}
        run: npm run ${{ matrix.command }}
