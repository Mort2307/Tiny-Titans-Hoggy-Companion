name: Tiny Titans Calculator Mobile QA

on:
  push:
    branches:
      - feature/universal-animal-breeding-20261025
    paths:
      - .github/workflows/calculator-mobile-qa.yml
      - scripts/test-calculator-mobile-layout.mjs
      - src/pages/Calculator.tsx
      - src/components/ParentSelector.tsx
      - src/components/BreedingOutcomeDashboard.tsx
      - src/components/UniversalSpeciesPicker.tsx
      - src/components/Layout/LayoutChrome.tsx
      - src/styles/calculator.css
      - src/styles/species-context.css
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project packages
        run: npm ci --no-audit --no-fund
      - name: Install Chromium for responsive validation
        run: npx playwright install --with-deps chromium
      - name: Build calculator and application
        run: npm run build
      - name: Start local development preview
        shell: bash
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 4173 > calculator-mobile-server.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat calculator-mobile-server.log
          exit 1
      - name: Validate authenticated phone layouts
        env:
          TINY_TITANS_TEST_URL: http://127.0.0.1:4173
          TINY_TITANS_VISUAL_BOT_EMAIL: ${{ secrets.TINY_TITANS_BOT_EMAIL }}
          TINY_TITANS_VISUAL_BOT_PASSWORD: ${{ secrets.TINY_TITANS_BOT_PASSWORD }}
        run: node scripts/test-calculator-mobile-layout.mjs
      - name: Preserve QA screenshots and measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-mobile-preview-${{ github.run_id }}
          path: |
            artifacts/calculator-mobile/
            calculator-mobile-server.log
          retention-days: 7
          if-no-files-found: warn
