name: Tiny Titans Quality Gate

on:
  push:
    branches: [main, feature/creator-hub-final-3]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html

      - name: Validate Functions syntax
        run: node --check functions/index.js

      - name: Lint changed Tester Bot code
        run: >-
          npx eslint
          src/pages/TesterCentre.tsx
          src/services/testerSecurityService.ts
          src/services/testerSecurityRunnerService.ts
          src/services/testerReportService.ts
          src/services/testerBotService.ts
          src/services/testerSuitesService.ts
          src/services/testerPhotoService.ts
