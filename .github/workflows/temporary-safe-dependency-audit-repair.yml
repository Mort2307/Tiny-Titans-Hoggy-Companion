name: Temporary safe dependency audit repair
on:
  push:
    branches:
      - chore/safe-dependency-audit-fix
    paths:
      - .github/workflows/temporary-safe-dependency-audit-repair.yml
      - package.json
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/safe-dependency-audit-fix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Reconcile lockfile with safe scoped overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes only
        run: |
          npm audit fix || audit_status=$?
          if [ "${audit_status:-0}" -gt 1 ]; then exit "$audit_status"; fi
          echo "Non-breaking fixes applied; remaining audit findings will be handled separately."
      - name: Validate dependency and application integrity
        run: |
          npm audit --audit-level=moderate
          npm run typecheck
          npm run lint
          npm run test:production-gate
          npm run build
      - name: Commit lockfile changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile changes produced by safe npm audit fix."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply non-breaking security updates"
          git push origin HEAD:chore/safe-dependency-audit-fix
