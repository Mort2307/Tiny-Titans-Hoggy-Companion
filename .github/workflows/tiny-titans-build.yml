name: Tiny Titans CI

on:
  push:
    branches: [master, feature/full-species-genetics-expansion-current]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'firebase.json'
      - '.github/workflows/tiny-titans-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'firebase.json'
      - '.github/workflows/tiny-titans-build.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_DIAGNOSTICS_DIR: ci-diagnostics

concurrency:
  group: tiny-titans-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_DIAGNOSTICS_DIR"
          npm run lint 2>&1 | tee "$CI_DIAGNOSTICS_DIR/lint.log"

      - name: Production build and application contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$CI_DIAGNOSTICS_DIR"
          npm run build 2>&1 | tee "$CI_DIAGNOSTICS_DIR/build.log"

      - name: Install Functions dependencies
        if: ${{ hashFiles('functions/package-lock.json') != '' }}
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Check Functions JavaScript syntax
        if: ${{ hashFiles('functions/package-lock.json') != '' }}
        working-directory: functions
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Upload CI diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tiny-titans-ci-diagnostics-${{ github.run_id }}
          path: ci-diagnostics/
          if-no-files-found: ignore
