name: Tiny Titans CI

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'firebase.json'
      - '.github/workflows/tiny-titans-build.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'functions/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/package.json'
      - 'functions/package-lock.json'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'firebase.json'
      - '.github/workflows/tiny-titans-build.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never waste Actions minutes validating an obsolete commit.
# A new push to the same PR/branch cancels the previous run.
concurrency:
  group: tiny-titans-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck, lint, contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # One dependency install for the application. Do not add separate runners
      # or repeated installs for routine validation.
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # This already runs the project's application contracts, intelligence
      # contracts, TypeScript build and Vite production build in one command.
      - name: Production build and application contracts
        run: npm run build

      # Keep Functions syntax validation on the same runner. It is cheap and
      # avoids creating another workflow/job just for a small check.
      - name: Install Functions dependencies
        if: ${{ hashFiles('functions/package-lock.json') != '' }}
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Check Functions JavaScript syntax
        if: ${{ hashFiles('functions/package-lock.json') != '' }}
        working-directory: functions
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

      # Browser/App BOT journeys are intentionally NOT part of routine PR CI.
      # They are an expensive, specialist validation and should only be run
      # deliberately when browser behaviour needs verification.
