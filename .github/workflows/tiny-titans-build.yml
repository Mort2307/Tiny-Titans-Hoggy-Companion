name: Tiny Titans Build Check

on:
  push:
    branches:
      - master
      - feature/feeding-preparation-notifications
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build
      - name: Install Functions dependencies
        working-directory: functions
        run: npm ci
      - name: Check Functions JavaScript syntax
        working-directory: functions
        run: node --check index.js
