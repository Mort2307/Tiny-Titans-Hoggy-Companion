name: Tiny Titans Build Check

on:
  push:
    branches:
      - master
      - chore/lint-zero-hardening
      - feature/feeding-preparation-notifications
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install application dependencies
        run: npm install --no-audit --no-fund
      - name: Lint application
        run: npm run lint
      - name: Build application
        run: npm run build
      - name: App BOT static route coverage
        run: node scripts/check-route-coverage.mjs
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Check Functions JavaScript syntax
        working-directory: functions
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
