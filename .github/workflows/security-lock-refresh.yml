name: Security Lock Refresh

on:
  push:
    branches: [dev/mobile-first-product-pass]
    paths:
      - 'package.json'
      - '.github/workflows/security-lock-refresh.yml'

permissions:
  contents: write

concurrency:
  group: security-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: dev/mobile-first-product-pass

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund

      - name: Apply safe npm audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "Tiny Titans Security Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git commit -m "security: refresh dependency lockfile"
          git push origin HEAD:dev/mobile-first-product-pass

      - name: Verify zero vulnerabilities
        shell: bash
        run: |
          npm audit --json > audit.json || true
          node - <<'NODE'
          const fs = require("fs");
          const audit = JSON.parse(fs.readFileSync("audit.json", "utf8"));
          const vulnerabilities = audit.metadata?.vulnerabilities ?? {};
          console.log("Audit vulnerabilities:", vulnerabilities);
          if ((vulnerabilities.total ?? 0) !== 0) process.exit(1);
          NODE
