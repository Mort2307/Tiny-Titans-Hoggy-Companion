name: Apply Titan UX patch

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: contains(github.event.head_commit.message, '[apply-titan-ux]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply global morph and intelligence UX fixes
        shell: python
        run: |
          from pathlib import Path

          def edit(path, replacements):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'Expected text not found in {path}: {old[:140]!r}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'No change made to {path}')
              p.write_text(text, encoding='utf-8')

          edit('src/pages/SpeciesMorphLibrary.tsx', [
              ('import { Link } from "react-router-dom";', 'import { Link, useNavigate } from "react-router-dom";'),
              ('  const { selectedSpeciesId, selectedSpecies } = useSpeciesContext();', '  const { selectedSpeciesId, selectedSpecies } = useSpeciesContext();\n  const navigate = useNavigate();'),
              ('  function closeImageSubmission() {\n    setShowImageSubmission(false);\n    setImageSubmissionMorphId("");\n  }\n\n  return (', '  function closeImageSubmission() {\n    setShowImageSubmission(false);\n    setImageSubmissionMorphId("");\n  }\n\n  function openMorphRecord(morphId: string) {\n    navigate(`/morph-library/${encodeURIComponent(morphId)}`);\n  }\n\n  function handleMorphCardClick(event: React.MouseEvent<HTMLElement>, morphId: string) {\n    const target = event.target as HTMLElement;\n    if (target.closest("a,button,input,textarea,select")) return;\n    openMorphRecord(morphId);\n  }\n\n  function handleMorphCardKeyDown(event: React.KeyboardEvent<HTMLElement>, morphId: string) {\n    if (event.key !== "Enter" && event.key !== " ") return;\n    event.preventDefault();\n    openMorphRecord(morphId);\n  }\n\n  return ('),
              ('            <article key={morph.geneId} className="morph-card morph-card--library">', '            <article\n              key={morph.geneId}\n              className="morph-card morph-card--library morph-card--clickable"\n              role="link"\n              tabIndex={0}\n              aria-label={`Open ${morph.name} genetics record`}\n              onClick={(event) => handleMorphCardClick(event, morph.geneId)}\n              onKeyDown={(event) => handleMorphCardKeyDown(event, morph.geneId)}\n            >'),
          ])

          edit('src/styles/morphLibrary.css', [
              ('\n', '\n',),
          ])
          css = Path('src/styles/morphLibrary.css')
          css_text = css.read_text(encoding='utf-8')
          if '.morph-card--clickable' not in css_text:
              css.write_text(css_text + '\n\n.morph-card--clickable { cursor: pointer; }\n.morph-card--clickable:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }\n', encoding='utf-8')

          edit('src/services/snakeIntelligenceService.ts', [
              ('      value: `${direction} · ${overview.weightChangeG >= 0 ? "+" : ""}${overview.weightChangeG.toFixed(1)}g overall`,', '      value: `Recent trend: ${direction} · Overall change: ${overview.weightChangeG >= 0 ? "+" : ""}${overview.weightChangeG.toFixed(1)}g`,'),
              ('      why: `${snake.name} does not yet have enough recorded ${missing} data for Tiny Titans to make stronger individual comparisons.`,', '      why: `${snake.name} does not yet have enough history across key areas to make stronger individual comparisons.`,'),
          ])

          edit('src/pages/SnakeMasterRecord.tsx', [
              ('import { Link, useParams } from "react-router-dom";', 'import { Link, useLocation, useParams } from "react-router-dom";'),
              ('  const { id } = useParams<{ id: string }>();\n  const { user } = useAuth();', '  const { id } = useParams<{ id: string }>();\n  const location = useLocation();\n  const intelligencePage = location.pathname.endsWith("/intelligence");\n  const { user } = useAuth();'),
              ('    <header className="master-hero"><div><p className="master-eyebrow">Individual Master Record</p><h1>{snake.name}</h1><p>{snake.morphs?.join(" • ") || "Western Hognose"}</p></div><Link className="master-back" to={`/snakes/${snake.id}`}>Snake profile</Link></header>', '    <header className="master-hero"><div><p className="master-eyebrow">{intelligencePage ? "🧠 Titan Intelligence" : "Individual Master Record"}</p><h1>{intelligencePage ? `${snake.name}'s Titan Intelligence` : snake.name}</h1><p>{intelligencePage ? "Living, record-derived intelligence for this individual. The same canonical intelligence used by the Master Record." : (snake.morphs?.join(" • ") || "Western Hognose")}</p></div><Link className="master-back" to={`/snakes/${snake.id}`}>Snake profile</Link></header>'),
              ('<section className="master-card tt-intelligence-panel" data-tone={intelligence?.priority?.tone ?? "neutral"}>', '<section id="titan-intelligence" className="master-card tt-intelligence-panel" data-tone={intelligence?.priority?.tone ?? "neutral">'),
          ])

          edit('src/pages/SnakeProfile.tsx', [
              ('        <button type="button" className="snake-profile-quick-primary" onClick={openMasterRecord}>📖<span className="snake-profile-quick-label">Master Record</span></button>', '        <button type="button" className="snake-profile-quick-primary" onClick={openMasterRecord}>📖<span className="snake-profile-quick-label">Master Record</span></button>\n        <button type="button" className="snake-profile-quick-intelligence" onClick={() => navigate(`/snakes/${snake.id}/intelligence`)}>🧠<span className="snake-profile-quick-label">Titan Intelligence</span></button>'),
              ('        <button type="button" className="snake-profile-card" onClick={openSnakeEditor}><div className="snake-profile-card-icon">🧬</div><h2>Genetics</h2><p><strong>{morphText}</strong></p><p>{snake.hets?.length ?? 0} het{snake.hets?.length !== 1 ? "s" : ""}</p>{snake.customMorph && <p>{snake.customMorph}</p>}</button>', '        <button type="button" className="snake-profile-card" onClick={openSnakeEditor}><div className="snake-profile-card-icon">🧬</div><h2>Genetics</h2><p><strong>{morphText}</strong></p><p>{snake.hets?.length ?? 0} het{snake.hets?.length !== 1 ? "s" : ""}</p>{snake.customMorph && <p>{snake.customMorph}</p>}</button>\n        <button type="button" className="snake-profile-card snake-profile-card-intelligence" onClick={() => navigate(`/snakes/${snake.id}/intelligence`)}><div className="snake-profile-card-icon">🧠</div><h2>Titan Intelligence</h2><p>Individual record-derived intelligence</p><p>Confidence: {intelligence?.confidence ?? "Building"}</p><p className="tt-intelligence-action">Open Titan Intelligence →</p></button>'),
          ])

          edit('src/components/TitanAnimalIntelligencePanel.tsx', [
              ('<div className="master-section-heading"><div><p className="master-eyebrow">🧠 V50 Animal Intelligence</p><h2>{snake.name}\'s living context</h2></div><Link to="/titan-intelligence">Open full Titan Intelligence →</Link></div>', '<div className="master-section-heading"><div><p className="master-eyebrow">🧠 V50 Animal Intelligence</p><h2>{snake.name}\'s living context</h2></div><Link to={`/snakes/${snake.id}/intelligence#titan-intelligence`}>Open full Titan Intelligence →</Link></div>'),
          ])

          edit('src/routes/AppRouter.tsx', [
              ('<Route path="/snakes/:id" element={<SnakeProfile/>}/><Route path="/snakes/:id/master-record" element={<SnakeMasterRecord/>}/>', '<Route path="/snakes/:id" element={<SnakeProfile/>}/><Route path="/snakes/:id/master-record" element={<SnakeMasterRecord/>}/><Route path="/snakes/:id/intelligence" element={<SnakeMasterRecord/>}/>'),
          ])

      - name: Validate patched application
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          npm test

      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name "Tiny Titans Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-titan-ux.yml
          git add src/pages/SpeciesMorphLibrary.tsx src/styles/morphLibrary.css src/services/snakeIntelligenceService.ts src/pages/SnakeMasterRecord.tsx src/pages/SnakeProfile.tsx src/components/TitanIntelligence/TitanAnimalIntelligencePanel.tsx src/routes/AppRouter.tsx
          git commit -m "Apply global species morph navigation and Titan Intelligence UX"
          git push origin HEAD:master
