name: Genetics Engine Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  genetics-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:genetics-model
      - run: npm run validate:genetics-runtime
      - run: npm run validate:genetics-engine
      - run: npm run validate:genetics-search
      - run: npm run validate:breeding-bridge
      - run: npx tsc -b
