name: RR3D Vivarium Magnet Verification

on:
  push:
    branches: [master]
    paths:
      - "src/pages/ReptileRoom3D.tsx"
      - "src/components/reptile-room-3d/**"
      - "src/services/reptileRoomService.ts"
      - ".github/workflows/rr3d-magnet-fix.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/pages/ReptileRoom3D.tsx"
      - "src/components/reptile-room-3d/**"
      - "src/services/reptileRoomService.ts"
      - ".github/workflows/rr3d-magnet-fix.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Reptile Room attachment behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify source wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'viv-group-${node.id}' src/pages/ReptileRoom3D.tsx
          grep -F 'object?.config?.linkedSlotId' src/pages/ReptileRoom3D.tsx
          grep -F 'selectedSlotBeforeAdd ? `viv-group-${selectedSlotBeforeAdd.id}`' src/pages/ReptileRoom3D.tsx

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
