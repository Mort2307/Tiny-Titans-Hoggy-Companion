name: Spatial Habitat 3D Verification

on:
  push:
    branches: [master]
    paths:
      - "src/components/reptile-room-3d/**"
      - "src/pages/ReptileRoom.tsx"
      - "src/pages/ReptileRoom3D.tsx"
      - "src/pages/ReptileRoomFirstPerson3D.tsx"
      - "src/pages/ReptileVivarium3DEditor.tsx"
      - "src/services/reptileRoomService.ts"
      - "src/services/spatialHabitatService.ts"
      - "scripts/validate-reptile-room-3d-contract.mjs"
      - "scripts/validate-spatial-habitat.mjs"
      - ".github/workflows/rr3d-magnet-fix.yml"
  pull_request:
    branches: [master]
    paths:
      - "src/components/reptile-room-3d/**"
      - "src/pages/ReptileRoom.tsx"
      - "src/pages/ReptileRoom3D.tsx"
      - "src/pages/ReptileRoomFirstPerson3D.tsx"
      - "src/pages/ReptileVivarium3DEditor.tsx"
      - "src/services/reptileRoomService.ts"
      - "src/services/spatialHabitatService.ts"
      - "scripts/validate-reptile-room-3d-contract.mjs"
      - "scripts/validate-spatial-habitat.mjs"
      - ".github/workflows/rr3d-magnet-fix.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify canonical Spatial Habitat 3D behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify spatial room wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'SpatialHabitatBuilder' src/pages/ReptileRoom.tsx
          grep -F 'validateSpatialScene' src/components/reptile-room-3d/SpatialHabitatBuilder.tsx
          grep -F 'saveSpatialHabitat' src/components/reptile-room-3d/SpatialHabitatBuilder.tsx
          npm run validate:spatial-habitat
          npm run validate:reptile-room-3d

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build