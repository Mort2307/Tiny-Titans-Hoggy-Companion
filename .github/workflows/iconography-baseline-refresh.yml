name: Iconography Baseline Refresh

on:
  push:
    branches: [dev/mobile-first-product-pass]
    paths:
      - 'scripts/audit-iconography.mjs'
      - '.github/workflows/iconography-baseline-refresh.yml'

permissions:
  contents: write

concurrency:
  group: iconography-baseline-refresh
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: dev/mobile-first-product-pass

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Generate legacy baseline
        shell: bash
        run: node scripts/audit-iconography.mjs --write-baseline || true

      - name: Commit baseline
        shell: bash
        run: |
          if git diff --quiet -- scripts/iconography-baseline.json; then
            echo "Iconography baseline already current"
          else
            git config user.name "Tiny Titans QA Bot"
            git config user.email "actions@users.noreply.github.com"
            git add scripts/iconography-baseline.json
            git commit -m "test: capture legacy iconography baseline"
            git push origin HEAD:dev/mobile-first-product-pass
          fi

      - name: Verify hard icon errors
        run: node scripts/audit-iconography.mjs --strict
