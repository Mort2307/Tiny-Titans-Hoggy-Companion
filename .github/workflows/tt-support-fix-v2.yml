name: Tiny Titans Support Fix v2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply fixes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def write(path, content):
              p = Path(path); p.parent.mkdir(parents=True, exist_ok=True); p.write_text(content, encoding='utf-8')

          # Historical weights: no today-only restriction, tolerant DD/MM/YYYY and YYYY-MM-DD parsing.
          p = Path('src/pages/WeightRecords.tsx'); text = p.read_text(encoding='utf-8')
          old_pattern = r'function maskDate\(value: string\).*?function makeId\(\) \{.*?\n'
          replacement = '''function parseDate(value: string): string | null {\n  const raw = value.trim();\n  let match = raw.match(/^(\\d{1,2})[\\/.-](\\d{1,2})[\\/.-](\\d{4})$/);\n  let day: number; let month: number; let year: number;\n  if (match) { day = Number(match[1]); month = Number(match[2]); year = Number(match[3]); }\n  else {\n    match = raw.match(/^(\\d{4})[\\/.-](\\d{1,2})[\\/.-](\\d{1,2})$/);\n    if (!match) return null;\n    year = Number(match[1]); month = Number(match[2]); day = Number(match[3]);\n  }\n  const date = new Date(Date.UTC(year, month - 1, day));\n  if (date.getUTCFullYear() !== year || date.getUTCMonth() !== month - 1 || date.getUTCDate() !== day) return null;\n  return `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;\n}\nfunction makeId() { return typeof crypto !== "undefined" && typeof crypto.randomUUID === "function" ? crypto.randomUUID() : `weight-${Date.now()}-${Math.random().toString(36).slice(2)}`; }\n'''
          text, count = re.subn(old_pattern, replacement, text, count=1, flags=re.S)
          if count != 1: raise SystemExit('Weight date helper block not found')
          text = text.replace('setTypedDate(maskDate(event.target.value))', 'setTypedDate(event.target.value)')
          text = text.replace('Use DD/MM/YYYY. Duplicate dates are prevented automatically.', 'Enter the date the weigh-in actually happened. Historical dates are allowed. Duplicate dates are prevented automatically.')
          p.write_text(text, encoding='utf-8')

          # Named reporter lookup, using the existing creator user directory service.
          write('src/components/CreatorReporterName.tsx', '''import { useEffect, useState } from "react";\nimport { getCreatorUserDisplayNames } from "../services/creatorUserDirectoryService";\n\nexport default function CreatorReporterName({ uid }: { uid: string }) {\n  const [name, setName] = useState(uid ? "Loading…" : "Not recorded");\n  useEffect(() => {\n    if (!uid) return;\n    let active = true;\n    void getCreatorUserDisplayNames([uid]).then((names) => { if (active) setName(names[uid] || "Anonymous user"); }).catch(() => { if (active) setName("Anonymous user"); });\n    return () => { active = false; };\n  }, [uid]);\n  return <>{name}</>;\n}\n''')
          p = Path('src/pages/CreatorIssueQueues.tsx'); text = p.read_text(encoding='utf-8')
          if 'CreatorReporterName' not in text:
              anchor = 'import { useAuth } from "../context/useAuth";\n'
              if anchor not in text: raise SystemExit('CreatorIssueQueues auth import not found')
              text = text.replace(anchor, anchor + 'import CreatorReporterName from "../components/CreatorReporterName";\n', 1)
          text = text.replace('<div><strong>Reporter UID</strong><span>{selectedBug.userId||"Not recorded"}</span></div>', '<div><strong>Reporter</strong><span><CreatorReporterName uid={selectedBug.userId || ""} /></span></div>', 1)
          p.write_text(text, encoding='utf-8')

          # Conversation deep-link support. Only add pieces that are missing.
          p = Path('src/pages/ConversationInbox.tsx'); text = p.read_text(encoding='utf-8')
          if 'useSearchParams' not in text:
              text = text.replace('import { Link } from "react-router-dom";', 'import { Link, useSearchParams } from "react-router-dom";', 1)
          if 'const [searchParams, setSearchParams]' not in text:
              text = text.replace('  const [queue, setQueue] = useState<Queue>("active");\n', '  const [queue, setQueue] = useState<Queue>("active");\n  const [searchParams, setSearchParams] = useSearchParams();\n', 1)
          if 'const id = searchParams.get("id");' not in text:
              anchor = '  useEffect(() => { if (!selected) { setMessages([]); return; }'
              effect = '''  useEffect(() => {\n    const id = searchParams.get("id");\n    const kind = searchParams.get("kind") as ConversationKind | null;\n    if (!id || !kind || threads.length === 0) return;\n    const target = threads.find((thread) => thread.id === id && thread.kind === kind);\n    if (!target) return;\n    setSelected(target);\n    const next = new URLSearchParams(searchParams); next.delete("id"); next.delete("kind");\n    setSearchParams(next, { replace: true });\n  }, [threads, searchParams, setSearchParams]);\n\n'''
              if anchor not in text: raise SystemExit('ConversationInbox message effect not found')
              text = text.replace(anchor, effect + anchor, 1)
          p.write_text(text, encoding='utf-8')

          # In-app unread support notification banner, backed by the same events used for push.
          write('src/components/NotificationCenter.tsx', '''import { collection, doc, onSnapshot, query, serverTimestamp, updateDoc, where } from "firebase/firestore";\nimport { useEffect, useRef, useState } from "react";\nimport { useLocation, useNavigate } from "react-router-dom";\nimport { useAuth } from "../context/useAuth";\nimport { db } from "../firebase/config";\nimport "../styles/notificationCenter.css";\n\ntype NotificationEvent = { id: string; type?: string; title?: string; body?: string; url?: string; createdAt?: unknown; read?: boolean };\nfunction timestamp(value: unknown): number {\n  if (!value) return 0;\n  if (typeof value === "object" && value !== null && "toMillis" in value && typeof value.toMillis === "function") return Number(value.toMillis()) || 0;\n  if (typeof value === "object" && value !== null && "toDate" in value && typeof value.toDate === "function") return value.toDate().getTime() || 0;\n  const parsed = new Date(String(value)).getTime(); return Number.isFinite(parsed) ? parsed : 0;\n}\n\nexport default function NotificationCenter() {\n  const { user } = useAuth(); const location = useLocation(); const navigate = useNavigate();\n  const [events, setEvents] = useState<NotificationEvent[]>([]); const initialised = useRef(false); const seen = useRef<Set<string>>(new Set());\n  const creatorMode = location.pathname.startsWith("/creator");\n  useEffect(() => {\n    initialised.current = false; seen.current = new Set(); setEvents([]); if (!user) return;\n    const eventsQuery = query(collection(db, "users", user.uid, "notificationEvents"), where("read", "==", false));\n    return onSnapshot(eventsQuery, (snapshot) => {\n      const next = snapshot.docs.map((item) => ({ id: item.id, ...(item.data() as Omit<NotificationEvent, "id">) })).sort((a, b) => timestamp(b.createdAt) - timestamp(a.createdAt));\n      if (initialised.current && typeof window !== "undefined" && "Notification" in window && Notification.permission === "granted" && document.visibilityState === "visible") {\n        snapshot.docChanges().forEach((change) => {\n          if (change.type !== "added" || seen.current.has(change.doc.id)) return;\n          const event = { id: change.doc.id, ...(change.doc.data() as Omit<NotificationEvent, "id">) };\n          const popup = new Notification(event.title || "Tiny Titans", { body: event.body || "You have a new Tiny Titans message.", icon: "/favicon.svg", badge: "/favicon.svg", tag: event.id });\n          popup.onclick = () => { window.focus(); if (event.url) window.location.assign(event.url); };\n        });\n      }\n      seen.current = new Set(snapshot.docs.map((item) => item.id)); setEvents(next); initialised.current = true;\n    }, (error) => console.warn("Tiny Titans: unread notification stream unavailable", error));\n  }, [user, creatorMode]);\n  async function openEvent(event: NotificationEvent) {\n    if (!user) return;\n    try { await updateDoc(doc(db, "users", user.uid, "notificationEvents", event.id), { read: true, readAt: serverTimestamp() }); } catch (error) { console.warn("Tiny Titans: unable to mark notification read", error); }\n    if (event.url) navigate(event.url);\n  }\n  if (!user || events.length === 0) return null;\n  const latest = events[0]; const extra = events.length - 1;\n  return <section className="tt-notification-center" role="status" aria-live="polite"><div className="tt-notification-icon" aria-hidden="true">🔔</div><div className="tt-notification-copy"><strong>{latest.title || "Tiny Titans notification"}</strong><p>{latest.body || "You have a new Tiny Titans message."}</p>{extra > 0 && <small>{extra} more notification{extra === 1 ? "" : "s"} waiting.</small>}</div><button type="button" className="tt-notification-view" onClick={() => void openEvent(latest)}>View</button></section>;\n}\n''')
          write('src/styles/notificationCenter.css', '''.tt-notification-center{display:flex;align-items:center;gap:14px;margin:12px 0 16px;padding:14px 16px;border:1px solid var(--tt-border,rgba(255,255,255,.12));border-radius:16px;background:var(--tt-panel,rgba(24,27,28,.94));box-shadow:0 10px 28px rgba(0,0,0,.18)}\n.tt-notification-icon{font-size:1.35rem;flex:0 0 auto}.tt-notification-copy{min-width:0;flex:1}.tt-notification-copy strong{display:block;margin-bottom:3px}.tt-notification-copy p{margin:0;opacity:.82;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tt-notification-copy small{display:block;margin-top:4px;opacity:.62}.tt-notification-view{flex:0 0 auto;border:0;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;background:var(--tt-accent,#d5aa4b);color:#111315}.tt-notification-view:hover{filter:brightness(1.05)}\n@media(max-width:680px){.tt-notification-center{align-items:flex-start}.tt-notification-copy p{white-space:normal}.tt-notification-view{align-self:center}}\n''')
          p = Path('src/components/Layout/Layout.tsx'); text = p.read_text(encoding='utf-8')
          if 'import NotificationCenter' not in text:
              text = text.replace('import CreatorStatusBar from "../CreatorStatusBar";\n', 'import CreatorStatusBar from "../CreatorStatusBar";\nimport NotificationCenter from "../NotificationCenter";\n', 1)
          if '<NotificationCenter />' not in text:
              text = text.replace('          <CreatorStatusBar />\n', '          <CreatorStatusBar />\n          <NotificationCenter />\n', 1)
          p.write_text(text, encoding='utf-8')

          # Background FCM + persistent unread event triggers for reports and replies.
          write('functions/supportNotifications.js', '''const { onDocumentCreated } = require("firebase-functions/v2/firestore");\nconst { getFirestore, FieldValue } = require("firebase-admin/firestore");\nconst { getMessaging } = require("firebase-admin/messaging");\n\nconst db=getFirestore(); const messaging=getMessaging(); const ORIGIN="https://tinytitans-hoggy-companion.web.app";\nconst clean=(v)=>String(v||"").trim(); const preview=(v,max=120)=>{const t=clean(v).replace(/\\s+/g," ");return t.length>max?`${t.slice(0,max-1)}…`:t;};\nasync function displayName(uid){const id=clean(uid);if(!id)return"Anonymous user";try{const s=await db.collection("users").doc(id).get();const d=s.data()||{};return clean(d.displayName||d.name)||"Anonymous user";}catch{return"Anonymous user";}}\nasync function creatorUids(){const s=await db.collection("users").get();return s.docs.filter((d)=>{const x=d.data()||{};return x.role==="admin"||x.role==="creator"||x.profileType==="creator";}).map((d)=>d.id);}\nasync function notify(uid,p){if(!uid)return;const eventKey=`${p.type}-${p.kind}-${p.relatedId}-${p.messageId||"submission"}`;await db.collection("users").doc(uid).collection("notificationEvents").doc(eventKey).set({type:p.type,kind:p.kind,relatedId:p.relatedId,title:p.title,body:p.body,url:p.url,read:false,createdAt:FieldValue.serverTimestamp()},{merge:true});try{const ts=await db.collection("users").doc(uid).collection("notificationTokens").where("enabled","==",true).get();const tokens=ts.docs.map((d)=>clean(d.data().token)).filter(Boolean);if(!tokens.length)return;const result=await messaging.sendEachForMulticast({tokens,notification:{title:p.title,body:p.body},data:{title:p.title,body:p.body,url:p.url,eventKey,notificationType:"support"},webpush:{fcmOptions:{link:p.url}}});const dead=[];result.responses.forEach((r,i)=>{const c=r.error?.code;if(c==="messaging/registration-token-not-registered"||c==="messaging/invalid-registration-token")dead.push(ts.docs[i].ref);});if(dead.length)await Promise.all(dead.map((r)=>r.delete()));}catch(e){console.warn("Tiny Titans support FCM delivery failed",e);}}\nasync function notifyCreators(kind,id,title,body){const ids=await creatorUids();await Promise.all(ids.map((uid)=>notify(uid,{type:"support-submission",kind,relatedId:id,title,body,url:`${ORIGIN}/creator/conversations?kind=${kind}&id=${encodeURIComponent(id)}`})));}\nexports.notifyCreatorsOfBugReport=onDocumentCreated({region:"europe-west2",document:"issueReports/{reportId}"},async(e)=>{const d=e.data?.data()||{};const id=clean(e.params.reportId);if(!id)return;await notifyCreators("bug",id,"🐛 New bug report",`${await displayName(d.userId)} submitted “${preview(d.title,90)}”.`);});\nexports.notifyCreatorsOfFeedback=onDocumentCreated({region:"europe-west2",document:"feedback/{feedbackId}"},async(e)=>{const d=e.data?.data()||{};const id=clean(e.params.feedbackId);if(!id)return;await notifyCreators("feedback",id,"💡 New community feedback",`${await displayName(d.userId)} submitted “${preview(d.title,90)}”.`);});\nasync function messageNotify(kind,parentId,messageId,message){const parentCollection=kind==="bug"?"issueReports":"feedback";const ps=await db.collection(parentCollection).doc(parentId).get();if(!ps.exists)return;const parent=ps.data()||{};const title=preview(parent.title,90)||"support conversation";const role=clean(message.senderRole);if(role==="creator"){const uid=clean(parent.userId);if(uid)await notify(uid,{type:"support-message",kind,relatedId:parentId,messageId,title:"💬 You have a new message",body:`Tiny Titans replied to “${title}”.`,url:`${ORIGIN}/conversations?kind=${kind}&id=${encodeURIComponent(parentId)}`});return;}if(role!=="user")return;const name=await displayName(message.senderId);const ids=await creatorUids();await Promise.all(ids.map((uid)=>notify(uid,{type:"support-message",kind,relatedId:parentId,messageId,title:`💬 Reply from ${name}`,body:`${name} replied to “${title}”: ${preview(message.message)}`,url:`${ORIGIN}/creator/conversations?kind=${kind}&id=${encodeURIComponent(parentId)}`})));}\nexports.notifyBugConversationMessage=onDocumentCreated({region:"europe-west2",document:"issueReports/{reportId}/messages/{messageId}"},async(e)=>messageNotify("bug",clean(e.params.reportId),clean(e.params.messageId),e.data?.data()||{}));\nexports.notifyFeedbackConversationMessage=onDocumentCreated({region:"europe-west2",document:"feedback/{feedbackId}/messages/{messageId}"},async(e)=>messageNotify("feedback",clean(e.params.feedbackId),clean(e.params.messageId),e.data?.data()||{}));\n''')
          p = Path('functions/index.js'); text = p.read_text(encoding='utf-8')
          if 'require("./supportNotifications")' not in text:
              anchor='Object.assign(exports, require("./notificationTest"));\n'
              if anchor not in text: raise SystemExit('functions/index notification anchor not found')
              text=text.replace(anchor,anchor+'Object.assign(exports, require("./supportNotifications"));\n',1)
          p.write_text(text,encoding='utf-8')
          print('Version-tolerant support patch applied.')
          PY
      - name: Validate application and Functions
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          cd functions
          npm ci --no-audit --no-fund
          find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Commit actual fixes directly to master
        run: |
          rm -f .github/workflows/tt-support-fix.yml .github/workflows/tt-support-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src functions .github/workflows/tt-support-fix.yml .github/workflows/tt-support-fix-v2.yml
          git add -u .github/workflows
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "fix: backfill weights and ship support messaging"
          git push origin HEAD:master
